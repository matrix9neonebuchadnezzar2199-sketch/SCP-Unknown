<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP-Unknown- 収容違反ダンジョン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=BIZ+UDPGothic:wght@400;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --font-main: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --font-serif: "Noto Serif JP", "Shippori Mincho", serif;
  --font-display: "Barlow Condensed", "BIZ UDPGothic", sans-serif;
  --color-background: 6 8 12;
  --color-surface: 12 18 28;
  --color-primary: 62 92 128;
  --color-secondary: 122 138 88;
  --color-accent: 196 163 74;
  --color-text: 220 226 218;
  --color-text-muted: 138 150 148;
  --color-frame: 36 52 72;
  --color-danger: 176 48 40;
  --button-bg: 10 14 22;
  --button-bg-hover: 22 32 48;
  --button-border: 48 68 88;
  --button-primary-bg: 28 48 72;
  --button-primary-bg-2: 48 76 108;
  --button-primary-hover: 62 96 132;
  --button-accent-bg: 196 163 74;
  --button-accent-text: 18 16 10;
  --splash-bg: #05070a;
  --splash-gold: #c4a34a;
  --cat-base: #c4a34a;
  --cat-tactical: #b03028;
  --cat-database: #7a8a58;
  --cat-settings: #5a7a98;
  --radius-card: 4px;
  --radius-pill: 2px;
  --chat-w: 300px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-main);
  background:
    radial-gradient(1100px 520px at 50% -8%, rgb(22 32 52 / 0.55), transparent 58%),
    rgb(var(--color-background));
  color: rgb(var(--color-text));
  overflow: hidden;
}
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; }
a { color: rgb(var(--color-secondary)); }

#splash {
  position: fixed; inset: 0; z-index: 100; background: var(--splash-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
}
#splash h1 { font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 0.22em; color: var(--splash-gold); text-transform: uppercase; }
#splash .spinner {
  width: 40px; height: 40px; border: 3px solid rgba(196,163,74,0.22);
  border-top-color: var(--splash-gold); border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#license-screen {
  position: fixed; inset: 0; z-index: 90; background: rgb(var(--color-background));
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.license-box {
  max-width: 560px; width: 100%; padding: 28px; border-radius: var(--radius-card);
  background: rgb(var(--color-surface)); border: 1px solid rgb(var(--color-frame));
  max-height: 90vh; overflow-y: auto;
}
.license-box h2 { font-family: var(--font-serif); margin-bottom: 12px; }
.license-box p { font-size: 13px; line-height: 1.7; color: rgb(var(--color-text-muted)); margin-bottom: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-pill); font-size: 13px;
  letter-spacing: 0.04em; transition: background 0.15s, transform 0.1s;
}
.btn:active { transform: translateY(1px) scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  color: #e8ece8;
  background: linear-gradient(180deg, rgb(var(--button-primary-bg-2)), rgb(var(--button-primary-bg)));
  border: 1px solid rgb(var(--color-accent) / 0.4);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.08);
}
.btn-primary:hover:not(:disabled) { background: rgb(var(--button-primary-hover)); }
.btn-secondary { color: rgb(var(--color-text)); background: rgb(var(--button-bg)); border: 1px solid rgb(var(--button-border)); }
.btn-secondary:hover:not(:disabled) { background: rgb(var(--button-bg-hover)); }
.btn-accent { color: rgb(var(--button-accent-text)); background: rgb(var(--button-accent-bg)); font-weight: 700; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-lg { padding: 12px 28px; font-size: 15px; font-weight: 700; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* Top bar */
.top-bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 16px; background: #05070a;
  border-bottom: 1px solid rgb(var(--color-frame)); flex-shrink: 0;
  box-shadow: inset 0 -2px 0 rgb(var(--color-accent) / 0.38);
}
.top-bar .brand { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.top-bar .brand small { display: block; font-family: var(--font-main); font-size: 0.62rem; color: rgb(var(--color-text-muted)); letter-spacing: 0.12em; }
.operator-chip {
  display: flex; align-items: center; gap: 8px; padding: 4px 12px;
  background: rgb(var(--color-background)); border: 1px solid rgb(var(--color-frame)); border-radius: var(--radius-pill);
  font-size: 12px;
}
.operator-chip .avatar {
  width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, rgb(var(--color-primary)), rgb(var(--color-secondary)));
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
}
.stat-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.pill {
  padding: 4px 10px; border-radius: var(--radius-pill); font-size: 11px;
  background: rgb(var(--color-background)); border: 1px solid rgb(var(--color-frame));
}
.pill strong { color: rgb(var(--color-accent)); }
/* 許可証の左。数値ピルと並べつつ操作ボタンだと分かるように枠は薄くする */
.header-doc {
  padding: 4px 10px; border-radius: 8px; background: transparent;
  color: rgb(var(--color-text-muted)); font-size: 11px; border: 1px solid transparent;
}
.header-doc:hover { color: rgb(var(--color-text)); border-color: rgb(var(--color-frame)); }
.header-doc-book { font-size: 16px; line-height: 1; padding: 4px 8px; }
.pill-stamina {
  display: flex; align-items: center; gap: 8px;
}
.pill-stamina .pill-bar {
  width: 88px; height: 6px; border-radius: 4px; overflow: hidden; flex-shrink: 0;
  background: rgb(var(--color-background)); border: 1px solid rgb(var(--color-frame));
}
.pill-stamina .pill-bar > i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, rgb(var(--button-primary-bg)), rgb(var(--button-primary-bg-2)));
}
.pill-stamina-timer { font-size: 10px; color: rgb(var(--color-text-muted)); white-space: nowrap; }
.top-actions { display: flex; gap: 6px; }
.top-actions button {
  padding: 5px 10px; border-radius: 8px; background: transparent;
  color: rgb(var(--color-text-muted)); font-size: 11px; border: 1px solid transparent;
}
.top-actions button:hover { color: rgb(var(--color-text)); border-color: rgb(var(--color-frame)); }
.top-actions button#btn-auth.authed { color: #5dca7a; border-color: #5dca7a55; }

/* Body: chat + main */
.app-body { display: grid; grid-template-columns: var(--chat-w) 1fr; flex: 1; min-height: 0; }

/* Chat sidebar */
.chat-sidebar {
  display: flex; flex-direction: column; background: rgb(var(--color-surface));
  border-right: 1px solid rgb(var(--color-frame)); min-height: 0;
}
.chat-tabs { display: flex; border-bottom: 1px solid rgb(var(--color-frame)); flex-shrink: 0; }
.chat-tabs button {
  flex: 1; padding: 8px 4px; background: transparent; color: rgb(var(--color-text-muted));
  font-size: 11px; border-bottom: 2px solid transparent;
}
.chat-tabs button.active { color: rgb(var(--color-text)); border-bottom-color: rgb(var(--color-primary)); }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; line-height: 1.5;
}
.chat-msg { margin-bottom: 8px; }
.chat-msg .who { font-weight: 700; color: rgb(var(--color-secondary)); margin-right: 6px; }
.chat-msg .who.system { color: rgb(var(--color-accent)); }
.chat-msg .who.cmd { color: rgb(var(--color-danger)); }
.chat-msg .time { font-size: 10px; color: rgb(var(--color-text-muted)); margin-left: 4px; }
.chat-msg .text { color: rgb(var(--color-text-muted)); word-break: break-word; }
.chat-input-row {
  display: flex; gap: 6px; padding: 8px; border-top: 1px solid rgb(var(--color-frame)); flex-shrink: 0;
}
.chat-input-row input {
  flex: 1; background: rgb(var(--color-background)); border: 1px solid rgb(var(--color-frame));
  color: rgb(var(--color-text)); padding: 8px 10px; border-radius: 8px; font-size: 12px;
}
.chat-footer { padding: 6px 10px; font-size: 10px; color: rgb(var(--color-text-muted)); border-top: 1px solid rgb(var(--color-frame)); }

/* Main */
.main-area { overflow-y: auto; padding: 14px; min-height: 0; }
.view-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
}
.view-header h1 { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: 0.14em; text-transform: uppercase; }
.back-btn {
  padding: 6px 14px; border-radius: var(--radius-pill); background: rgb(var(--button-bg));
  border: 1px solid rgb(var(--button-border)); color: rgb(var(--color-text-muted)); font-size: 12px;
}
.back-btn:hover { color: rgb(var(--color-text)); }

.panel {
  background: rgb(var(--color-surface)); border: 1px solid rgb(var(--color-frame) / 0.85);
  border-radius: var(--radius-card); padding: 16px; margin-bottom: 12px;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.04), 0 0 0 1px rgb(var(--color-primary) / 0.14);
}
.panel h2 { font-family: var(--font-display); font-size: 1.15rem; margin-bottom: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
.panel h3 { font-size: 0.85rem; color: rgb(var(--color-text-muted)); margin: 12px 0 6px; letter-spacing: 0.08em; }

/* Dashboard */
.tac-panel {
  background: rgb(var(--color-surface)); border: 1px solid rgb(var(--color-frame));
  border-radius: var(--radius-card); padding: 14px; margin-bottom: 10px;
}
.tac-panel .label {
  font-size: 10px; letter-spacing: 0.18em; color: rgb(var(--color-text-muted)); margin-bottom: 8px;
}

/* 展開部隊: 戦力の右に部隊アイコン（枠は旧40pxの2倍） */
.dash-squad { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.dash-power { font-size: 1.35rem; font-weight: 700; color: rgb(var(--color-accent)); line-height: 1.1; flex-shrink: 0; }
.dash-power small { display: block; font-size: 10px; font-weight: 400; color: rgb(var(--color-text-muted)); letter-spacing: 0.12em; }
.dash-status-meters {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px;
  width: 100%; margin-top: 8px;
}
@media (max-width: 560px) { .dash-status-meters { grid-template-columns: 1fr; } }

.squad-strip { display: flex; gap: 8px; flex-wrap: wrap; }
.squad-mini { width: 80px; text-align: center; font-size: 9px; }
.squad-mini .icon, .squad-mini .catalog-art {
  width: 80px; height: 80px; border-radius: 8px; margin: 0 auto 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; border: 1px solid rgb(var(--color-frame));
  overflow: hidden; background: #080c12; position: relative;
}
.squad-mini .icon img, .squad-mini .catalog-art img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
}
.squad-mini .icon.empty { opacity: 0.3; }
.squad-mini .lv { color: rgb(var(--color-accent)); }

.equip-screen {
  display: grid;
  grid-template-columns: minmax(260px, 40%) 1fr;
  gap: 14px;
  align-items: start;
}
@media (max-width: 900px) { .equip-screen { grid-template-columns: 1fr; } }
.equip-hero {
  border: 1px solid rgb(var(--color-frame));
  border-radius: var(--radius-card);
  overflow: hidden;
  background: #080a0e;
}
.equip-hero img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 58vh;
  object-fit: cover;
  object-position: center top;
}
.equip-stats {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 10px 12px 12px;
  border-top: 1px solid rgb(var(--color-frame));
  background: rgb(8 12 18);
}
.equip-stat {
  display: grid;
  grid-template-columns: 3.2em 1fr 4.8em;
  gap: 8px;
  align-items: center;
  font-size: 11px;
  letter-spacing: 0.06em;
}
.equip-stat .bar {
  height: 9px;
  background: #05070a;
  border: 1px solid #1c2836;
  box-shadow: inset 0 0 0 1px #000;
  overflow: hidden;
}
.equip-stat .bar > i {
  display: block;
  height: 100%;
  max-width: 100%;
  background-image: linear-gradient(180deg, rgb(255 255 255 / 0.28), transparent 42%),
    repeating-linear-gradient(90deg, currentColor 0 5px, rgb(0 0 0 / 0.28) 5px 6px);
  background-color: currentColor;
}
.equip-stat.s-hp { color: #5dca7a; }
.equip-stat.s-atk { color: #d06058; }
.equip-stat.s-anm { color: #58c4dc; }
.equip-stat.s-def { color: #7a8a58; }
.equip-stat.s-spd { color: #c4a34a; }
.equip-stat.s-luck { color: #c5c9d1; }
.equip-stat b {
  color: inherit;
  font-family: Consolas, "Courier New", monospace;
  font-size: 11px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.equip-skills { padding: 0 12px 12px; font-size: 11px; color: rgb(var(--color-text-muted)); }
.equip-skills .sk { margin-top: 6px; }
.equip-skills strong { color: rgb(var(--color-accent)); }
.equip-right .label { margin-bottom: 8px; }
.equip-slot-list { display: flex; flex-direction: column; gap: 5px; }
.equip-slot {
  display: grid;
  grid-template-columns: 40px 7.5em minmax(0, 1fr) auto auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid rgb(var(--color-frame));
  background: rgb(var(--color-surface));
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  border-radius: var(--radius-card);
}
.equip-slot:hover { border-color: rgb(var(--color-primary)); }
.equip-slot.active { border-color: #58c4dc; box-shadow: 0 0 0 1px #58c4dc66; }
.equip-slot .icon {
  width: 40px; height: 40px; object-fit: contain;
  background: #10141c; border: 1px solid rgb(var(--color-frame));
}
.equip-slot .icon.empty {
  display: block;
  background: rgb(var(--color-background));
  border-style: dashed;
}
.equip-slot .slot-name {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: rgb(var(--color-text-muted));
}
.equip-slot .slot-item { font-size: 13px; min-width: 0; }
.equip-slot .slot-item .stars { color: #ffd93d; font-size: 10px; margin-left: 6px; }
.equip-slot .slot-item .empty { color: rgb(var(--color-text-muted)); }
.equip-att-row {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  max-width: 196px;
  justify-content: flex-end;
}
.equip-att-ic {
  width: 22px;
  height: 22px;
  padding: 0;
  border: 1px solid rgb(var(--color-frame));
  background: #10141c;
  border-radius: 3px;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: rgb(var(--color-text-muted));
  font-size: 11px;
  line-height: 1;
  position: relative;
  overflow: hidden;
}
.equip-att-ic img { width: 18px; height: 18px; object-fit: contain; pointer-events: none; }
.equip-att-ic.empty { border-style: dashed; background: rgb(var(--color-background)); }
.equip-att-ic:hover { border-color: #58c4dc; }
.equip-pick { margin-top: 12px; }
.equip-pick h3 { margin-top: 0; }
.equip-pick-row {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  gap: 10px;
  align-items: center;
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 6px;
  border: 1px solid rgb(var(--color-frame));
  background: rgb(var(--color-background));
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  border-radius: var(--radius-card);
  position: relative;
  overflow: hidden;
}
.equip-pick-row:hover { border-color: #58c4dc; }
.equip-pick-row img { width: 40px; height: 40px; object-fit: contain; background: #10141c; }
.equip-pick-row .nm { font-size: 13px; }
.equip-pick-row .stars { color: #ffd93d; font-size: 11px; margin-left: 6px; }
.equip-pick-row .st { font-size: 11px; color: rgb(var(--color-text-muted)); margin-top: 2px; }
.equip-pick-row .st .up { color: #5dca7a; }
.equip-pick-row .st .down { color: #e05048; }
.equip-pick-row .sk { font-size: 11px; color: rgb(var(--color-accent)); margin-top: 2px; }
.equip-pick-row .qty { font-size: 11px; color: rgb(var(--color-text-muted)); }

.equip-slot-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px;
  align-items: stretch;
}
.equip-slot-row .equip-slot { cursor: pointer; }
.equip-slot .lv-badge {
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: #c4a34a;
  font-variant-numeric: tabular-nums;
}
.wt-badge {
  display: inline-block;
  margin-right: 6px;
  padding: 0 5px;
  font-size: 10px;
  letter-spacing: 0.1em;
  border: 1px solid rgb(var(--color-frame));
  border-radius: 3px;
  vertical-align: 1px;
}
.wt-gun { color: #58c4dc; border-color: #58c4dc66; }
.wt-blade { color: #e08a5a; border-color: #e08a5a66; }
.part-badge {
  display: inline-block;
  margin-right: 6px;
  padding: 0 5px;
  font-size: 10px;
  letter-spacing: 0.06em;
  border: 1px solid rgb(var(--color-frame));
  border-radius: 3px;
  vertical-align: 1px;
  color: #9ad4e4;
  border-color: #58c4dc55;
}
.part-badge.part-gun { color: #58c4dc; border-color: #58c4dc66; }
.part-badge.part-blade { color: #e08a5a; border-color: #e08a5a66; }
.part-badge.part-armor { color: #c4a34a; border-color: #c4a34a66; }
.part-badge.part-head { color: #8ec8ff; border-color: #8ec8ff66; }
.part-badge.part-attach { color: #b8a0e8; border-color: #b8a0e866; }
.equip-att-row.att-na {
  font-size: 10px;
  color: rgb(var(--color-text-muted));
  justify-content: flex-end;
  align-items: center;
}
.pick-att-row {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  margin-top: 4px;
}
.pick-att-row .equip-att-ic { width: 18px; height: 18px; }
.pick-att-row .equip-att-ic img { width: 15px; height: 15px; }
.equip-slot-actions {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 7.5em;
}
.equip-slot-actions .btn { width: 100%; padding: 4px 8px; font-size: 11px; }

.enhance-box { width: min(520px, 100%); position: relative; }
.enhance-box .advice-close, .attach-box .advice-close {
  position: absolute; top: 10px; right: 12px;
}
.enhance-head {
  display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
}
.enhance-head img {
  width: 56px; height: 56px; object-fit: contain;
  background: #10141c; border: 1px solid rgb(var(--color-frame)); border-radius: 6px;
}
.enhance-head h4 { margin: 0 0 4px; }
.enhance-head .sub { font-size: 12px; color: rgb(var(--color-text-muted)); }
.enhance-stats {
  display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px;
  font-size: 12px; margin: 10px 0 12px;
}
.enhance-stats .h { color: rgb(var(--color-text-muted)); font-size: 10px; letter-spacing: 0.08em; }
.enhance-stats .up { color: #5dca7a; }
.enhance-slider-row {
  display: flex; align-items: center; gap: 8px; margin: 8px 0 12px;
}
.enhance-slider-row input[type="range"] { flex: 1; accent-color: rgb(var(--color-accent)); }

.attach-box {
  width: min(860px, 100%);
  background: rgb(var(--color-surface));
  border: 1px solid rgb(var(--color-frame));
  border-radius: var(--radius-card);
  padding: 16px 18px 18px;
  position: relative;
}
.attach-layout {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 16px;
  align-items: start;
}
.attach-stats-col { font-size: 12px; }
.attach-stats-col .row {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 3px 0; border-bottom: 1px solid rgb(var(--color-frame) / 0.45);
}
.attach-stats-col .row .up { color: #5dca7a; }
.attach-stage {
  display: grid;
  grid-template-columns: 148px 1fr 148px;
  grid-template-areas:
    "sight gun ammo"
    "barrel gun magazine"
    "stock gun grip"
    "muzzle gun underbarrel";
  gap: 8px;
  align-items: center;
  min-height: 280px;
}
.attach-gun {

.drop-zone .zone-name { font-size: 12px; font-weight: 700; }
.drop-zone .zone-desc { font-size: 10px; color: rgb(var(--color-text-muted)); margin-top: 3px; line-height: 1.5; }
.drop-zone.trash.over { border-color: rgb(var(--color-danger)); }
.drop-zone.scrap.over { border-color: rgb(var(--color-secondary)); }
.slot-grid.over, .parts-row.over { outline: 1px dashed rgb(var(--color-primary)); outline-offset: 3px; }

.bulk-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }

/* 司令室の入手アイテム要約 */
.loot-panel { cursor: pointer; }
.loot-panel:hover { border-color: rgb(var(--color-primary)); }
.loot-summary { display: flex; flex-wrap: nowrap; gap: 5px; align-items: center; min-height: 48px; }
.loot-icon {
  position: relative; width: 46px; height: 46px; flex: 0 0 46px;
  border-radius: 6px; border: 1px solid rgb(var(--color-frame));
  background: rgb(var(--color-background));
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; pointer-events: none;
}
.loot-icon img {
  width: 78%; height: 78%; object-fit: contain; position: relative; z-index: 1;
}
.loot-icon .ph {
  display: none; position: relative; z-index: 1;
  font-size: 12px; color: #fff; text-shadow: 0 0 3px #000;
}
.loot-icon .qty {
  position: absolute; right: 2px; bottom: 1px; z-index: 2;
  font-family: Consolas, monospace; font-size: 10px; font-weight: 700;
  color: #fff; text-shadow: 0 0 3px #000;
}
.loot-icon.more {
  font-family: Consolas, monospace; font-size: 12px; font-weight: 700;
  color: rgb(var(--color-text-muted));
}

.breach-advice {
  margin-bottom: 10px; padding: 10px 12px; border-radius: 8px;
  background: rgba(176,48,40,0.1); border: 1px solid rgba(176,48,40,0.55);
}
.breach-advice .advice-head {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  color: rgb(var(--color-danger)); margin-bottom: 4px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.advice-close {
  background: none; border: none; cursor: pointer; padding: 0 2px;
  font-size: 15px; line-height: 1; color: rgb(var(--color-text-muted));
}
.advice-close:hover { color: rgb(var(--color-danger)); }
.breach-advice p { font-size: 12px; line-height: 1.6; margin-bottom: 8px; }
.advice-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.boost-chip {
  align-self: center; font-size: 11px; font-family: Consolas, monospace;
  color: rgb(var(--color-secondary)); padding: 4px 10px; border-radius: var(--radius-pill);
  border: 1px solid rgb(var(--color-secondary)); background: rgba(122,138,88,0.12);
}

/* 区画探索: 左 MAP / 右 ログ列。MAP は設定メニューまで1画面に収まる高さへ縮める */
.sector-grid { display: grid; grid-template-columns: auto minmax(330px, 390px); gap: 12px; align-items: start; }
@media (max-width: 1180px) { .sector-grid { grid-template-columns: 1fr; } }
.sector-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sector-side .label { margin-bottom: 5px; }
.sector-side .battle-log { max-height: min(43.2vh, 324px); }
.sector-map-row { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.sentry-ammo-col {
  display: flex; flex-direction: column; gap: 6px;
  flex: 0 0 128px; width: 128px;
}
.sentry-ammo-col[hidden] { display: none; }
.sentry-ammo-card {
  background: rgb(var(--color-surface));
  border: 1px solid rgb(var(--color-frame));
  border-radius: var(--radius-card);
  padding: 8px 10px;
}
.sentry-ammo-card .ammo-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  color: #5dca7a; margin-bottom: 4px;
}
.sentry-ammo-card .ammo-count {
  font-family: Consolas, monospace; font-size: 13px; font-weight: 700;
  color: #5dca7a; margin-bottom: 5px;
}
.sentry-ammo-card .meter-bar { height: 8px; }
.sentry-ammo-card .meter-fill.green { background: linear-gradient(90deg, #2e8a48, #5dca7a); }
.sentry-ammo-card.empty .ammo-title,
.sentry-ammo-card.empty .ammo-count {
  color: rgb(var(--color-danger));
  animation: sentry-ammo-blink 0.55s step-end infinite;
}
.sentry-ammo-card.empty .meter-fill.green { background: rgb(var(--color-danger)); }
@keyframes sentry-ammo-blink {
  50% { opacity: 0.2; }
}

/* Menu grid（1行コンパクト） */
.menu-section { margin-bottom: 10px; }
.menu-row {
  display: grid; grid-template-columns: 46px 1fr; gap: 0;
  background: rgb(var(--color-surface)); border: 1px solid rgb(var(--color-frame));
  border-radius: 10px; overflow: hidden; margin-bottom: 6px;
}
.menu-cat {
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; writing-mode: vertical-rl;
  text-orientation: mixed; padding: 6px 2px;
}
.menu-cat.base { background: rgba(196,163,74,0.15); color: var(--cat-base); border-right: 1px solid rgb(var(--color-frame)); }
.menu-cat.tactical { background: rgba(176,48,40,0.14); color: var(--cat-tactical); border-right: 1px solid rgb(var(--color-frame)); }
.menu-cat.database { background: rgba(122,138,88,0.14); color: var(--cat-database); border-right: 1px solid rgb(var(--color-frame)); }
.menu-cat.settings { background: rgba(62,92,128,0.2); color: var(--cat-settings); border-right: 1px solid rgb(var(--color-frame)); }
.menu-btns {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 5px; padding: 6px;
}
.menu-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 7px;
  background: rgb(var(--color-background)); border: 1px solid rgb(var(--color-frame));
  color: rgb(var(--color-text)); font-size: 12px; text-align: left; line-height: 1.2;
  transition: border-color 0.15s, background 0.15s;
}
.menu-btn:hover { border-color: rgb(var(--color-primary)); background: rgb(var(--button-bg-hover)); }
.menu-btn.disabled { opacity: 0.45; cursor: not-allowed; }
.menu-btn .icon { font-size: 14px; line-height: 1; flex-shrink: 0; }
.menu-btn .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn .sub {
  font-size: 10px; color: rgb(var(--color-accent)); flex-shrink: 0;
  font-family: Consolas, monospace;
}

/* Unit cards etc */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.unit-card {
  padding: 12px; border-radius: 10px; background: rgb(var(--color-background));
  border: 1px solid rgb(var(--color-frame)); cursor: pointer; transition: border-color 0.15s;
}
.unit-card:hover { border-color: rgb(var(--color-primary)); }
.unit-card.selected { border-color: rgb(var(--color-accent)); box-shadow: 0 0 0 1px rgb(var(--color-accent) / 0.4); }
.unit-card .badge {
  display: inline-block; padding: 2px 8px; border-radius: var(--radius-pill);
  font-size: 10px; font-weight: 700; margin-bottom: 4px;
}
.unit-card .name { font-weight: 700; font-size: 14px; }
.unit-card .meta { font-size: 11px; color: rgb(var(--color-text-muted)); margin-top: 4px; }
.unit-card .stats { font-size: 11px; margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.placeholder-img, .catalog-art {
  width: 48px; height: 48px; border-radius: 8px;
  margin: 0 auto 6px;
  overflow: hidden; background: #080c12; border: 1px solid rgb(var(--color-frame));
  position: relative;
}
.catalog-art img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
}
.catalog-art .ph-fallback {
  display: none; position: absolute; inset: 0;
  align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}

.codex-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
}
.codex-card {
  position: relative;
  display: flex; flex-direction: column;
  border: 1px solid rgb(var(--color-frame)); background: rgb(var(--color-background));
  border-radius: var(--radius-card); overflow: hidden;
}
.codex-card.locked { opacity: 1; }
.codex-card .stamp {
  position: absolute; top: 8px; right: 8px; z-index: 1;
  padding: 2px 7px; font-size: 9px; letter-spacing: 0.08em;
  border-radius: var(--radius-pill); background: rgba(8,12,18,0.82);
  border: 1px solid rgb(var(--color-frame)); color: rgb(var(--color-text-muted));
}
.codex-card .stamp.ok { color: rgb(var(--color-accent)); border-color: rgb(var(--color-accent) / 0.5); }
.codex-card .catalog-art {
  width: 100%; height: 168px; margin: 0; border: 0; border-radius: 0;
}
.codex-card .body { padding: 10px 12px 12px; }
.codex-card .badge {
  display: inline-block; padding: 2px 8px; border-radius: var(--radius-pill);
  font-size: 10px; font-weight: 700; margin-bottom: 4px;
}
.codex-card .scp { font-size: 11px; letter-spacing: 0.04em; color: rgb(var(--color-text-muted)); }
.codex-card .nm { font-size: 14px; font-weight: 700; margin: 2px 0 4px; }
.codex-card .meta { font-size: 11px; color: rgb(var(--color-text-muted)); }
.codex-card .look { font-size: 11px; line-height: 1.55; color: rgb(var(--color-text-muted)); margin-top: 6px; }
.codex-card .sk { font-size: 10px; margin-top: 6px; color: rgb(var(--color-accent)); line-height: 1.45; }
.codex-card .own { font-size: 10px; color: rgb(var(--color-text-muted)); margin-top: 4px; }
.squad-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.squad-slot {
  width: 100px; min-height: 80px; border: 2px dashed rgb(var(--color-frame));
  border-radius: 10px; padding: 8px; font-size: 11px; text-align: center; cursor: pointer;
}
.squad-slot.filled { border-style: solid; border-color: rgb(var(--color-primary)); background: rgb(var(--color-background)); }

.squad-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.squad-cell {
  border: 1px dashed rgb(var(--color-frame)); border-radius: var(--radius-card);
  padding: 8px; background: rgb(var(--color-surface)); min-height: 168px;
}
.squad-cell.filled { border-style: solid; border-color: rgb(var(--color-primary)); cursor: pointer; }
.squad-cell .slot-idx {
  font-size: 10px; letter-spacing: 0.14em; color: rgb(var(--color-text-muted)); margin-bottom: 6px;
  font-family: var(--font-display);
}
.squad-cell.operator-slot {
  border-style: solid; border-color: rgb(var(--color-accent));
  background: rgb(var(--color-accent) / 0.06); cursor: pointer;
}
.squad-cell.operator-slot .op-avatar {
  width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 6px;
  background: linear-gradient(135deg, rgb(var(--color-primary)), rgb(var(--color-accent) / 0.5));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #f0e2b0;
  border: 1px solid rgb(var(--color-accent) / 0.6);
}
.squad-mini .icon.operator {
  background: rgb(var(--color-accent) / 0.2) !important;
  border-color: rgb(var(--color-accent)) !important;
  color: #c4a34a !important;
}
.squad-summary { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; font-size: 12px; }
.squad-summary .warn { color: rgb(var(--color-danger)); }
.class-pill {
  display: inline-block; padding: 2px 8px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 700;
  border: 1px solid rgb(var(--color-frame));
}

.site-tree-layout {
  display: grid; grid-template-columns: minmax(220px, 1fr) minmax(280px, 1.15fr);
  gap: 18px; align-items: start;
}
@media (max-width: 720px) { .site-tree-layout { grid-template-columns: 1fr; } }
.site-tree {
  display: flex; flex-direction: column; align-items: stretch;
  padding: 8px 4px 4px;
}
.site-node {
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
  width: 100%; padding: 4px 6px; border: 1px solid transparent; border-radius: var(--radius-card);
  background: transparent; color: inherit; text-align: left;
}
.site-node:hover { background: rgb(var(--button-bg-hover) / 0.55); }
.site-node.selected { border-color: rgb(var(--color-accent) / 0.55); background: rgb(var(--color-accent) / 0.08); }
.site-node.locked { opacity: 0.42; }
.site-node.done { opacity: 0.82; }
.site-node-gem {
  position: relative; width: 46px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em;
  color: rgb(var(--color-text-muted)); flex-shrink: 0;
}
.site-node-gem::before, .site-node-gem::after {
  content: ""; position: absolute; inset: 0;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
}
.site-node-gem::before { background: rgb(var(--color-frame)); }
.site-node-gem::after { inset: 2px; background: #0c121c; }
.site-node-gem b { position: relative; z-index: 1; }
.site-node.done .site-node-gem { color: rgb(var(--color-accent)); }
.site-node.done .site-node-gem::before { background: rgb(var(--color-accent)); }
.site-node.done .site-node-gem::after { background: rgb(28 24 12); }
.site-node.current .site-node-gem { color: #f0e2b0; }
.site-node.current .site-node-gem::before {
  background: rgb(var(--color-accent));
  animation: site-gem-pulse 1.8s ease-in-out infinite;
}
.site-node.current .site-node-gem::after { background: rgb(36 30 12); }
.site-node.next .site-node-gem { color: rgb(var(--color-accent)); }
.site-node.next .site-node-gem::before { background: rgb(var(--color-accent) / 0.7); }
.site-node.selected .site-node-gem { transform: scale(1.06); }
@keyframes site-gem-pulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.35); }
}
.site-node-name { display: block; font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.site-node.selected .site-node-name { color: rgb(var(--color-accent)); }
.site-node-tag { font-size: 10px; color: rgb(var(--color-text-muted)); letter-spacing: 0.06em; }
.site-link {
  width: 2px; height: 18px; margin: 0 0 0 28px;
  background: rgb(var(--color-frame));
}
.site-link.on { background: rgb(var(--color-accent) / 0.75); }
.site-hover {
  position: relative;
  padding: 16px 18px 16px 20px;
  background: rgb(8 12 20 / 0.96);
  border: 1px solid rgb(var(--color-accent) / 0.45);
  border-radius: var(--radius-card);
  box-shadow: 0 12px 36px rgb(0 0 0 / 0.45);
}
.site-hover::before {
  content: ""; position: absolute; left: -6px; top: 26px;
  width: 11px; height: 11px;
  background: rgb(8 12 20 / 0.96);
  border-left: 1px solid rgb(var(--color-accent) / 0.45);
  border-bottom: 1px solid rgb(var(--color-accent) / 0.45);
  transform: rotate(45deg);
}
@media (max-width: 720px) { .site-hover::before { display: none; } }
.site-hover .kicker {
  font-size: 10px; letter-spacing: 0.16em; color: rgb(var(--color-accent));
  margin-bottom: 6px; text-transform: uppercase;
}
.site-hover h2 {
  margin-bottom: 6px; text-transform: none; font-family: var(--font-main);
  font-size: 1.05rem; letter-spacing: 0.04em;
}
.site-hover .desc { font-size: 12px; line-height: 1.7; color: rgb(var(--color-text-muted)); margin-bottom: 12px; }
.site-hover-stats { display: grid; gap: 6px; margin-bottom: 12px; font-size: 12px; }
.site-hover-stats div {
  display: grid; grid-template-columns: 7.5em 1fr; gap: 8px;
  padding: 4px 0; border-bottom: 1px solid rgb(var(--color-frame) / 0.6);
}
.site-hover-stats dt { color: rgb(var(--color-text-muted)); }
.site-hover-stats dd { font-variant-numeric: tabular-nums; }
.site-hover .cost { font-size: 12px; margin: 0 0 12px; color: rgb(var(--color-text-muted)); }
.ptree-hover-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 6px; }
.ptree-hover-icon {
  width: 48px; height: 48px; object-fit: contain; flex: 0 0 auto;
  background: #101820; border: 1px solid rgb(var(--color-frame)); border-radius: 6px;
}
.site-delta { font-size: 12px; margin: 8px 0 12px; line-height: 1.7; }
.site-delta .up, .site-hover .up { color: #5dca7a; }

.ptree-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin: 0 0 12px; font-size: 12px; color: rgb(var(--color-text-muted));
}
.ptree-bar strong { color: rgb(var(--color-accent)); font-variant-numeric: tabular-nums; }
.ptree-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
  gap: 14px; align-items: start;
}
@media (max-width: 860px) { .ptree-layout { grid-template-columns: 1fr; } }
.ptree-stage {
  position: relative; background: #070a10;
  border: 1px solid rgb(var(--color-frame)); border-radius: var(--radius-card);
  overflow: hidden;
}
.ptree-stage svg { width: 100%; height: auto; display: block; }
.ptree-pins { position: absolute; inset: 0; }
.ptree-node {
  position: absolute; transform: translate(-50%, -50%);
  width: 36px; height: 36px; padding: 0; border-radius: 50%;
  border: 2px solid #3a4a5c; background: #101820; cursor: pointer; z-index: 1;
  overflow: hidden;
}
.ptree-node img {
  display: block; width: 100%; height: 100%; object-fit: contain;
  pointer-events: none;
}
.ptree-node.notable { width: 46px; height: 46px; }
.ptree-node.keystone {
  width: 52px; height: 52px; border-radius: 6px;
}
.ptree-node.start { width: 48px; height: 48px; border-width: 2px; }
.ptree-node.locked img { filter: grayscale(1) brightness(0.7); }
.ptree-node.c-sentry { border-color: #c4a34a; }
.ptree-node.c-gear { border-color: #7a8a58; }
.ptree-node.c-salvage { border-color: #b07048; }
.ptree-node.c-ops { border-color: #5a7a98; }
.ptree-node.c-link { border-color: #6a7a88; }
.ptree-node.c-core { border-color: #c4a34a; }
.ptree-node.on { box-shadow: 0 0 12px #c4a34a99; }
.ptree-node.c-gear.on { box-shadow: 0 0 12px #7a8a5899; }
.ptree-node.c-salvage.on { box-shadow: 0 0 12px #b0704899; }
.ptree-node.c-ops.on { box-shadow: 0 0 12px #5a7a9899; }
.ptree-node.reach:not(.on) { box-shadow: 0 0 0 1px #c4a34a66; }
.ptree-node.locked { opacity: 0.32; }
.ptree-node.selected { outline: 2px solid #fff; outline-offset: 2px; z-index: 2; }
.ptree-legend {
  display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;
  font-size: 10px; letter-spacing: 0.08em; color: rgb(var(--color-text-muted));
}
.ptree-legend i {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 4px; vertical-align: middle; border: 1px solid currentColor;
}
.site-facility-row {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
}

.craft-toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.craft-toolbar .label { font-size: 10px; letter-spacing: 0.12em; color: rgb(var(--color-text-muted)); margin-right: 4px; }
.craft-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.craft-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px 12px; border-radius: var(--radius-card);
  border: 1px solid rgb(var(--color-frame)); background: rgb(var(--color-background));
}
.craft-card.affordable { border-color: rgb(var(--color-accent) / 0.55); }
.craft-card.locked { opacity: 0.72; }
.item-hover {
  position: fixed; z-index: 70; width: min(320px, calc(100vw - 24px));
  pointer-events: none;
  padding: 12px 14px;
  background: rgb(8 12 20 / 0.96);
  border: 1px solid rgb(var(--color-accent) / 0.5);
  border-radius: var(--radius-card);
  box-shadow: 0 12px 36px rgb(0 0 0 / 0.5);
}
.item-hover[hidden] { display: none; }
.item-hover-kicker {
  font-size: 9px; letter-spacing: 0.16em; color: rgb(var(--color-accent));
  margin-bottom: 8px; text-transform: uppercase;
}
.item-hover-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.item-hover-head img {
  width: 64px; height: 64px; object-fit: contain; flex: 0 0 64px;
  background: #10141c; border: 1px solid rgb(var(--color-frame)); border-radius: 6px;
}
.item-hover-head .nm { font-weight: 700; font-size: 14px; line-height: 1.3; }
.item-hover-head .stars { color: #ffd93d; font-size: 11px; margin-top: 2px; }
.item-hover-head .sub { font-size: 11px; color: rgb(var(--color-text-muted)); margin-top: 3px; }
.item-hover-stats { display: grid; gap: 3px; margin-bottom: 10px; font-size: 12px; }
.item-hover-stats div {
  display: grid; grid-template-columns: 4.5em 1fr; gap: 8px;
  padding: 2px 0; border-bottom: 1px solid rgb(var(--color-frame) / 0.55);
}
.item-hover-stats dt { color: rgb(var(--color-text-muted)); }
.item-hover-stats dd { font-variant-numeric: tabular-nums; }
.item-hover-fx {
  font-size: 12px; line-height: 1.55;
  border-top: 1px solid rgb(var(--color-frame) / 0.55); padding-top: 8px;
}
.item-hover-fx strong { color: rgb(var(--color-accent)); display: block; margin-bottom: 3px; }
.item-hover-fx p { margin: 0; color: rgb(var(--color-text-muted)); }
.craft-out {
  display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: start;
}
.craft-out img {
  width: 48px; height: 48px; object-fit: contain;
  background: #10141c; border-radius: 6px; border: 1px solid rgb(var(--color-frame));
}
.craft-out .nm { font-size: 13px; font-weight: 700; line-height: 1.35; }
.craft-out .stars { color: #ffd93d; font-size: 11px; margin-left: 4px; }
.craft-kind {
  display: inline-block; margin-top: 4px; padding: 1px 7px;
  font-size: 9px; letter-spacing: 0.08em; border-radius: var(--radius-pill);
  border: 1px solid rgb(var(--color-frame)); color: rgb(var(--color-text-muted));
}
.craft-stock { font-size: 10px; color: rgb(var(--color-text-muted)); margin-top: 4px; }
.craft-mats { display: flex; flex-wrap: wrap; gap: 6px; }
.craft-mat {
  display: flex; align-items: center; gap: 5px; padding: 4px 7px;
  font-size: 10px; border-radius: var(--radius-pill);
  border: 1px solid rgb(var(--color-frame)); background: rgb(var(--color-surface));
}
.craft-mat img { width: 22px; height: 22px; object-fit: contain; background: #10141c; border-radius: 4px; }
.craft-mat.ok { border-color: rgb(var(--color-secondary) / 0.45); }
.craft-mat.lack { border-color: rgb(var(--color-danger) / 0.55); color: rgb(var(--color-danger)); }
.craft-mat small { opacity: 0.75; }
.craft-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: auto; padding-top: 4px; border-top: 1px solid rgb(var(--color-frame) / 0.6);
}
.craft-foot .cost { font-size: 11px; color: rgb(var(--color-text-muted)); font-variant-numeric: tabular-nums; }
.craft-foot .cost.lack { color: rgb(var(--color-danger)); }
.craft-empty { font-size: 12px; color: rgb(var(--color-text-muted)); padding: 16px 4px; }

.fusion-lab-head {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.fusion-lab-head h2 { margin-bottom: 0; }
.fusion-kicker {
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.16em;
  color: rgb(var(--color-accent)); margin-bottom: 4px;
}
.fusion-lab-meta {
  display: flex; gap: 10px; align-items: center; font-family: Consolas, monospace; font-size: 11px;
  color: rgb(var(--color-text-muted));
}
.fusion-lab-meta .warn { color: rgb(var(--color-danger)); }
.fusion-row {
  display: grid; grid-template-columns: 1fr 36px 1fr 36px 1fr; gap: 8px;
  align-items: stretch; margin: 10px 0 14px;
}
@media (max-width: 820px) { .fusion-row { grid-template-columns: 1fr; } .fusion-op { display: none; } }
.fusion-box {
  border: 1px solid rgb(var(--color-frame)); border-radius: var(--radius-card);
  padding: 10px; min-height: 210px; background: rgb(var(--color-background));
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.04);
}
.fusion-box.over { border-color: rgb(var(--color-accent)); background: rgb(var(--button-bg-hover)); }
.fusion-box.result { border-color: rgb(var(--color-accent) / 0.45); }
.fusion-box .lab {
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.16em;
  color: rgb(var(--color-text-muted)); display: flex; justify-content: space-between; gap: 8px;
}
.fusion-box .lab b { color: rgb(var(--color-accent)); font-weight: 700; }
.fusion-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; border: 1px dashed rgb(var(--color-frame)); border-radius: 6px;
  color: rgb(var(--color-text-muted)); font-size: 11px; letter-spacing: 0.08em; min-height: 140px;
}
.fusion-empty .plus { font-size: 22px; color: rgb(var(--color-accent) / 0.7); line-height: 1; }
.fusion-op {
  display: flex; align-items: center; justify-content: center;
  color: rgb(var(--color-accent)); font-family: var(--font-display); font-size: 1.1rem;
}
.fusion-op span {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid rgb(var(--color-accent) / 0.45);
  display: flex; align-items: center; justify-content: center;
  background: rgb(var(--color-surface));
}
.fusion-specimen { cursor: grab; padding: 2px 0; border: none; background: transparent; box-shadow: none; }
.fusion-specimen .catalog-art, .fusion-result .catalog-art { width: 56px; height: 56px; }
.fusion-mini { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
.fst-mini {
  display: grid; grid-template-columns: 2.6em 1fr 2.2em; gap: 4px; align-items: center;
  font-family: Consolas, monospace; font-size: 10px; color: rgb(var(--color-text-muted));
}
.fst-mini b { color: rgb(var(--color-text)); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.fusion-result { display: flex; flex-direction: column; gap: 2px; }
.fusion-skills-note { font-size: 10px; color: rgb(var(--color-text-muted)); margin-top: 8px; letter-spacing: 0.04em; }
.fusion-pool-kicker {
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.16em;
  color: rgb(var(--color-accent)); margin-bottom: 4px;
}
.fusion-result-name { font-weight: 700; font-size: 15px; }
.fusion-result-sub { font-size: 12px; color: rgb(var(--color-text-muted)); margin-top: 2px; }
.fusion-mode {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  padding: 2px 8px; border-radius: var(--radius-pill); margin-top: 4px;
}
.fusion-mode.recipe { color: #5dca7a; border: 1px solid #5dca7a66; background: #5dca7a18; }
.fusion-mode.lineage { color: rgb(var(--color-accent)); border: 1px solid rgb(var(--color-accent) / 0.4); }
.fusion-compare {
  border: 1px solid rgb(var(--color-frame)); border-radius: var(--radius-card);
  padding: 10px 12px; background: rgb(6 8 12 / 0.55); margin-bottom: 12px;
}
.fusion-compare-head {
  display: grid; grid-template-columns: 3.2em 1fr 1fr 1fr; gap: 8px;
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.1em;
  color: rgb(var(--color-text-muted)); margin-bottom: 8px;
}
.fst {
  display: grid; grid-template-columns: 3.2em 1fr 1fr 1fr; gap: 8px; align-items: center;
  margin-bottom: 5px;
}
.fst-k { font-family: Consolas, monospace; font-size: 10px; color: rgb(var(--color-text-muted)); }
.fst-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fst-bar {
  flex: 1; height: 6px; background: rgb(var(--color-frame) / 0.55); border-radius: 3px; overflow: hidden;
}
.fst-bar i { display: block; height: 100%; background: rgb(var(--color-secondary)); }
.fst-cell.result .fst-bar i { background: rgb(var(--color-accent)); }
.fst-v { font-family: Consolas, monospace; font-size: 11px; font-weight: 700; min-width: 2.2em; text-align: right; }
.fst-d { font-family: Consolas, monospace; font-size: 10px; min-width: 2.4em; }
.fst-d.up { color: #5dca7a; }
.fst-d.down { color: rgb(var(--color-danger)); }
.fst-d.flat { color: rgb(var(--color-text-muted)); }
.fusion-skills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.fusion-sk {
  font-size: 10px; padding: 3px 8px; border-radius: var(--radius-pill);
  border: 1px solid rgb(var(--color-frame)); color: rgb(var(--color-text-muted));
}
.fusion-sk.inherit { color: rgb(var(--color-accent)); border-color: rgb(var(--color-accent) / 0.4); }
.fusion-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#cross-pick .unit-card[draggable="true"], .fusion-box .unit-card[draggable="true"] { cursor: grab; }
#cross-pick .unit-card.dragging, .fusion-box .unit-card.dragging { opacity: 0.45; }
.recipe-ok { color: #5dca7a; }
.xp-bar { height: 5px; background: rgb(var(--color-background)); border: 1px solid rgb(var(--color-frame)); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.xp-fill { height: 100%; background: rgb(var(--color-secondary)); }

.hint-warn { color: rgb(var(--color-danger)); font-size: 12px; margin: 6px 0; }
.battle-log {
  font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.6;
  max-height: 400px; overflow-y: auto; padding: 12px;
  background: rgb(var(--color-background)); border-radius: 8px; border: 1px solid rgb(var(--color-frame));
}
.battle-log .win { color: rgb(var(--color-secondary)); }
.battle-log .lose { color: rgb(var(--color-danger)); }
.battle-log .contact { color: rgb(var(--color-accent)); }

/* Sector scan map */
.sector-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.sector-head .floor-now { color: #ffd93d; }
.sector-legend { margin-left: auto; display: flex; gap: 12px; font-size: 11px; color: rgb(var(--color-text-muted)); }
.sector-legend i.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.sector-legend i.dot.blue { background: #5a96c8; box-shadow: 0 0 6px #5a96c8; }
.sector-legend i.dot.red { background: rgb(var(--color-danger)); box-shadow: 0 0 6px rgb(var(--color-danger)); }
.sector-wrap {
  position: relative; border-radius: var(--radius-card); overflow: hidden;
  border: 1px solid rgb(var(--color-frame)); background: #07090c;
  width: min(100%, calc(min(36vh, 330px) * 1.21 * 920 / 430));
}
.sector-wrap canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 920 / 430;
}
.sector-hud {
  position: absolute; left: 10px; bottom: 8px;
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.14em;
  color: rgba(196, 163, 74, 0.85); pointer-events: none;
}
.sector-hud-meta {
  position: absolute; right: 10px; bottom: 8px;
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.14em;
  color: rgba(196, 163, 74, 0.55); pointer-events: none;
}
.sector-run-clock {
  position: absolute; top: 8px; right: 10px; z-index: 4;
  font-family: Consolas, monospace; font-size: 20px; font-weight: 700;
  letter-spacing: 0.12em; font-variant-numeric: tabular-nums;
  color: #ffd93d; pointer-events: none;
  background: rgb(8 10 14 / 0.86);
  border: 1px solid rgb(var(--color-accent) / 0.5);
  padding: 6px 12px 8px; min-width: 92px; text-align: right;
}
.sector-run-clock small {
  display: block; font-size: 9px; letter-spacing: 0.16em; font-weight: 400;
  color: rgb(var(--color-text-muted)); margin-bottom: 2px; text-align: right;
}
.sector-run-clock.warn {
  color: rgb(var(--color-danger));
  border-color: rgb(var(--color-danger) / 0.55);
}
.limited-loot-box .result-loot { margin: 8px 0 12px; }
.sentry-banner {
  position: absolute; top: 8px; left: 8px; right: 8px; z-index: 2;
  pointer-events: none;
  padding: 6px 10px;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: #c4a34a;
  background: rgb(8 10 14 / 0.82);
  border: 1px solid rgb(var(--color-accent) / 0.45);
}
#sector-canvas.place-sentry { cursor: crosshair; }
.btn-sentry { gap: 6px; }
.btn-sentry svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
.btn-sentry .sentry-count { font-size: 10px; color: rgb(var(--color-text-muted)); }
.btn-sentry.placing { border-color: rgb(var(--color-accent)); color: rgb(var(--color-accent)); }
.sector-legend i.dot.gold { background: #c4a34a; box-shadow: 0 0 6px #c4a34a; }
.sector-legend i.dot.op {
  background: #5a96c8; box-shadow: 0 0 6px #5a96c8;
}
.sector-legend i.dot.sentry {
  background: transparent; box-shadow: none;
  border: 2px dashed #5dca7a;
}

/* TOKYO 地点選択マップ（NVG 画像に合わせた緑のウェイポイント） */
.btn-map-select {
  align-self: center;
  letter-spacing: 0.14em;
  min-width: 92px;
  font-family: var(--font-display);
  font-size: 13px;
}
.city-map-panel { padding: 10px; }
.city-map-note {
  font-family: Consolas, monospace; font-size: 11px; letter-spacing: 0.12em;
  color: #7cff6b; margin-bottom: 8px;
}
.city-map {
  position: relative; width: 100%;
  border: 1px solid rgba(124, 255, 107, 0.35);
  background: #000;
}
.city-map img { display: block; width: 100%; height: auto; pointer-events: none; }
.map-poi {
  position: absolute; transform: translate(-50%, -110%);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: transparent; border: none; padding: 0; cursor: pointer; z-index: 2;
}
.map-poi .pin {
  width: 10px; height: 10px; border: 2px solid #7cff6b;
  background: rgba(0, 8, 4, 0.85); transform: rotate(45deg);
  box-shadow: 0 0 8px #7cff6b;
}
.map-poi .tag {
  font-family: var(--font-display); font-size: 12px; letter-spacing: 0.08em;
  color: #7cff6b; background: rgba(0, 8, 4, 0.84);
  border: 1px solid #7cff6b; padding: 3px 8px 4px; white-space: nowrap;
  display: flex; flex-direction: column; align-items: center; line-height: 1.15; gap: 1px;
}
.map-poi .tag small {
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.04em; opacity: 0.9;
}
.map-poi:hover .tag, .map-poi:hover .pin { filter: brightness(1.25); }
.map-poi.active .tag {
  color: #05070a; background: #c4a34a; border-color: #c4a34a;
}
.map-poi.active .pin {
  border-color: #c4a34a; background: #c4a34a; box-shadow: 0 0 8px #c4a34a;
}
.map-poi.limited .pin {
  border-color: #e0a84a; box-shadow: 0 0 10px #e0a84a;
}
.map-poi.limited .tag {
  color: #e0a84a; border-color: #e0a84a;
}
.map-poi.limited .limited-clock {
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.06em;
  color: #ffe08a;
}
.map-poi.limited.locked {
  filter: grayscale(1) brightness(0.55);
}
.map-poi.limited.locked .limited-clock { color: #9aa0a8; }
.map-poi.dim { opacity: 0.45; }
.map-poi.limited.active .tag {
  color: #05070a; background: #e0a84a; border-color: #e0a84a;
}
.map-poi.limited.active .pin {
  border-color: #e0a84a; background: #e0a84a; box-shadow: 0 0 8px #e0a84a;
}
.map-hq {
  position: absolute; transform: translate(-50%, -110%);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  pointer-events: none; z-index: 3;
}
.map-hq .pin {
  width: 12px; height: 12px; border-radius: 50%;
  background: #5a96c8; border: 2px solid #c8e0f0;
  box-shadow: 0 0 10px #5a96c8;
}
.map-hq .tag {
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.08em;
  color: #c8e0f0; background: rgba(8, 16, 28, 0.82);
  border: 1px solid #5a96c8; padding: 1px 6px; white-space: nowrap;
}
.map-hq .tag small { display: block; font-size: 9px; color: #8ab4d4; letter-spacing: 0.04em; }
.map-osprey {
  position: absolute; width: 52px; height: 52px;
  transform: translate(-50%, -210%);
  pointer-events: none; z-index: 4;
  filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.9));
}
.map-osprey.fly {
  transition: left 0.9s cubic-bezier(0.45, 0.05, 0.2, 1), top 0.9s cubic-bezier(0.45, 0.05, 0.2, 1);
}
.map-osprey img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  animation: osprey-bob 2.4s ease-in-out infinite;
}
.map-osprey.fly img { animation: none; }
@keyframes osprey-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.map-site-blurb {
  margin-top: 10px; padding: 10px 12px;
  border: 1px solid rgb(var(--color-frame)); background: rgb(var(--color-background));
}
.map-site-blurb strong { font-size: 13px; margin-right: 8px; }
.map-site-blurb .kind {
  display: inline-block; padding: 1px 7px; font-size: 10px; letter-spacing: 0.08em;
  border: 1px solid rgb(var(--color-accent) / 0.45); color: rgb(var(--color-accent));
  border-radius: var(--radius-pill);
}
.map-site-blurb p { font-size: 12px; color: rgb(var(--color-text-muted)); margin-top: 6px; line-height: 1.55; }

.rarity-hud {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  margin-bottom: 10px; padding: 6px 8px;
  background: rgb(var(--color-background)); border: 1px solid rgb(var(--color-frame));
}
.rarity-hud-label {
  font-size: 10px; letter-spacing: 0.16em; color: rgb(var(--color-accent));
  font-family: var(--font-display); margin-right: 4px;
}
.rarity-chip {
  font-family: Consolas, monospace; font-size: 10px;
  color: rgb(var(--color-text-muted)); padding: 1px 6px;
  border: 1px solid rgb(var(--color-frame));
}
.rarity-chip b { color: #ffd93d; margin-right: 3px; }
.rarity-chip[data-r="A"] b, .rarity-chip[data-r="S"] b, .rarity-chip[data-r="SS"] b {
  color: rgb(var(--color-accent));
}

.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th, .data-table td { padding: 6px 10px; border-bottom: 1px solid rgb(var(--color-frame)); text-align: left; }
.data-table th { color: rgb(var(--color-text-muted)); font-weight: 400; }

.profile-dossier .profile-kicker {
  font-family: Consolas, monospace; font-size: 10px; letter-spacing: 0.18em;
  color: rgb(var(--color-accent)); margin-bottom: 4px;
}
.profile-dossier h2 { margin-bottom: 4px; }
.profile-serial {
  font-family: Consolas, monospace; font-size: 11px; letter-spacing: 0.1em;
  color: rgb(var(--color-text-muted)); margin-bottom: 16px;
}
.profile-grid {
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start;
}
@media (max-width: 860px) { .profile-grid { grid-template-columns: 1fr; } }
.profile-id-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.profile-portrait {
  position: relative; width: 188px; height: 188px;
  background: #05070a; border: 1px solid rgb(var(--color-accent) / 0.45);
  box-shadow: 0 0 24px rgb(var(--color-accent) / 0.08);
  overflow: hidden;
}
.profile-portrait img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  filter: saturate(0.85) contrast(1.08);
}
.profile-portrait .ph {
  display: none; width: 100%; height: 100%;
  align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 3rem; letter-spacing: 0.08em;
  color: rgb(var(--color-accent)); background: #0a1018;
}
.profile-portrait .scan {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(180deg, transparent 0 2px, rgb(0 0 0 / 0.18) 2px 3px);
}
.profile-tick {
  position: absolute; width: 16px; height: 16px; pointer-events: none; z-index: 2;
  border-color: #c4a34a;
}
.profile-tick.tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
.profile-tick.tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
.profile-tick.bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
.profile-tick.br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }
.profile-stamp {
  position: absolute; bottom: 12px; right: 8px; z-index: 2;
  font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.16em;
  color: rgb(176 48 40 / 0.88); border: 2px solid rgb(176 48 40 / 0.72);
  padding: 2px 8px; transform: rotate(-9deg);
  background: rgb(6 8 12 / 0.35);
}
.profile-id-name {
  font-family: var(--font-display); font-size: 1.35rem; letter-spacing: 0.12em;
  text-align: center; line-height: 1.1;
}
.profile-id-title {
  font-size: 11px; letter-spacing: 0.1em; color: rgb(var(--color-text-muted)); text-align: center;
}
.profile-fields { display: grid; gap: 14px; }
.profile-field label {
  display: block; font-size: 10px; letter-spacing: 0.16em;
  color: rgb(var(--color-text-muted)); margin-bottom: 6px;
}
.profile-field input[type="text"] { width: 100%; }
.profile-clear { display: flex; flex-wrap: wrap; gap: 6px; }
.profile-clear button {
  min-width: 52px; padding: 7px 8px;
  font-family: var(--font-display); font-size: 13px; letter-spacing: 0.08em;
  color: rgb(var(--color-text-muted)); background: rgb(var(--color-background));
  border: 1px solid rgb(var(--color-frame));
}
.profile-clear button small { display: block; font-family: var(--font-main); font-size: 9px; letter-spacing: 0.04em; font-weight: 400; }
.profile-clear button.on {
  color: #05070a; background: rgb(var(--color-accent)); border-color: rgb(var(--color-accent));

/* ===== Firebase 全体チャット（財団通信網） ===== */
// API キーは公開前提の値。不正防止は Realtime Database のセキュリティルール側で行う
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCbu_DbJk5p4Y4m0sFqcml_3l1uYxN6QCE",
  authDomain: "scp-unknown.firebaseapp.com",
  databaseURL: "https://scp-unknown-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "scp-unknown",
  storageBucket: "scp-unknown.firebasestorage.app",
  messagingSenderId: "70413225498",
  appId: "1:70413225498:web:4f9b402be49321ecf94ba3",
};
let fbDb = null;
let fbAuthed = false;
let fbMessages = [];
const FB_CHAT_LIMIT = 50;
let fbUser = null;
let fbLastSyncUid = null;
let cloudSaveTimer = 0;
let cloudSaveState = "off"; // off / idle / saved / error
const CLOUD_SYNC_UID_KEY = "scp-unknown-cloud-sync-uid";
let fbOnlineCount = 0;
let presenceUid = null;
let presenceListOn = false;
let presenceConnectedOn = false;
const PRESENCE_CONN_ID = "c" + Math.random().toString(36).slice(2, 12);

function isGoogleUser(user) {
  return !!(user && !user.isAnonymous);
}

function rememberedSyncUid() {
  try { return localStorage.getItem(CLOUD_SYNC_UID_KEY) || ""; } catch (e) { return ""; }
}

function rememberSyncUid(uid) {
  try { localStorage.setItem(CLOUD_SYNC_UID_KEY, uid); } catch (e) { /* quota */ }
}

function clearCloudSaveTimer() {
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = 0;
}

function writeCloudSave(s, uid) {
  return fbDb.ref(`saves/${uid}`).set({
    data: JSON.stringify(s),
    ts: Date.now(),
    version: GAME_DATA.version || "",
  });
}

function googleAuthProvider() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  return provider;
}

function authErrorMsg(e) {
  const code = e?.code || "";
  if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return null;
  if (code === "auth/popup-blocked") return "ポップアップがブロックされました。ページ遷移で再試行します";
  if (code === "auth/unauthorized-domain") return "このドメインは未承認です（Firebase の承認済みドメインを確認）";
  if (code === "auth/operation-not-allowed") return "Google ログインが無効です（コンソールで有効化）";
  return `ログインに失敗しました（${code || e?.message || "不明"}）`;
}

function initFirebaseChat() {
  if (typeof firebase === "undefined") return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(() => {})
      .then(() => firebase.auth().getRedirectResult())
      .catch((e) => {
        if (e?.code === "auth/credential-already-in-use" || e?.code === "auth/email-already-in-use") {
          return firebase.auth().signInWithCredential(e.credential);
        }
        const msg = authErrorMsg(e);
        if (msg) toast(msg);
      })
      .finally(() => {
        let authChecked = false;
        firebase.auth().onAuthStateChanged((user) => {
          fbUser = user;
          fbAuthed = !!user;
          updateAuthUi();
          if (!authChecked) {
            authChecked = true;
            if (!user) firebase.auth().signInAnonymously().catch(() => { fbAuthed = false; });
          }
          if (user) startPresence(user.uid);
          else stopPresence();
          if (isGoogleUser(user)) {
            if (fbLastSyncUid !== user.uid) syncCloudSave();
          } else {
            clearCloudSaveTimer();
            fbLastSyncUid = null;
            cloudSaveState = "off";
          }
        });
      });
    fbDb.ref("chat/all").limitToLast(FB_CHAT_LIMIT).on("child_added", (snap) => {
      const m = snap.val();
      if (!m || typeof m.text !== "string") return;
      fbMessages.push({
        user: String(m.user || "Unknown").slice(0, 40),
        text: m.text.slice(0, 200),
        ts: typeof m.ts === "number" ? m.ts : Date.now(),
      });
      if (fbMessages.length > FB_CHAT_LIMIT) fbMessages = fbMessages.slice(-FB_CHAT_LIMIT);
      if (chatChannel === "all") renderChat();
    });
  } catch (e) {
    fbDb = null;
  }
}

function updateAuthUi() {
  const btn = document.getElementById("btn-auth");
  if (!btn) return;
  if (fbUser && !fbUser.isAnonymous) {
    const name = (fbUser.displayName || fbUser.email || "Google").split("@")[0];
    const mark = cloudSaveState === "saved" ? "・同期済" : cloudSaveState === "error" ? "・同期失敗" : "";
    btn.textContent = `${name}${mark}`;
    btn.classList.add("authed");
  } else {
    btn.textContent = "Google ログイン";
    btn.classList.remove("authed");
  }
}

async function handleAuthButton() {
  if (typeof firebase === "undefined") { toast("ネットワーク未接続です"); return; }
  if (location.protocol === "file:") {
    toast("Google ログインは file:// では使えません。localhost の HTTP で開いてください");
    return;
  }
  if (fbUser && !fbUser.isAnonymous) {
    const ok = await showConfirm({ title: "ログアウト", body: "ログアウトしますか？ ローカルのセーブは残ります。" });
    if (!ok) return;
    await firebase.auth().signOut();
    clearCloudSaveTimer();
    fbLastSyncUid = null;
    cloudSaveState = "off";
    updateAuthUi();
    firebase.auth().signInAnonymously().catch(() => {});
    return;
  }
  const provider = googleAuthProvider();
  const current = firebase.auth().currentUser;
  try {
    if (current && current.isAnonymous) {
      try {
        await current.linkWithPopup(provider);
      } catch (e) {
        if (e.code === "auth/credential-already-in-use" || e.code === "auth/email-already-in-use") {
          await firebase.auth().signInWithCredential(e.credential);
        } else if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
          await current.linkWithRedirect(provider);
          return;
        } else {
          throw e;
        }
      }
    } else {
      await firebase.auth().signInWithPopup(provider);
    }
  } catch (e) {
    if (e?.code === "auth/popup-blocked" || e?.code === "auth/operation-not-supported-in-this-environment") {
      await firebase.auth().signInWithRedirect(provider);
      return;
    }
    const msg = authErrorMsg(e);
    if (msg) toast(msg);
  }
}

/** クラウドへ保存（1.5秒デバウンス）。Google ログイン中のみ。発火時に uid を再確認する */
function pushCloudSave(s) {
  if (!fbDb || !isGoogleUser(fbUser)) return;
  const uid = fbUser.uid;
  const snapshot = s;
  clearCloudSaveTimer();
  cloudSaveTimer = setTimeout(() => {
    if (!isGoogleUser(fbUser) || fbUser.uid !== uid) return;
    writeCloudSave(snapshot, uid).then(() => {
      if (!isGoogleUser(fbUser) || fbUser.uid !== uid) return;
      cloudSaveState = "saved";
      rememberSyncUid(uid);
      updateAuthUi();
    }).catch((e) => {
      const already = cloudSaveState === "error";
      cloudSaveState = "error";
      updateAuthUi();
      if (!already) {
        const denied = e?.code === "PERMISSION_DENIED" || /permission denied/i.test(String(e?.message || ""));
        toast(denied
          ? "クラウド保存に失敗しました（PERMISSION_DENIED — Firebase の saves ルール未公開）"
          : `クラウド保存に失敗しました（${e.code || e.message}）`);
      }
    });
  }, 1500);
}
window.onGameSaved = (s) => pushCloudSave(s);

/** ログイン時の同期。このブラウザで未確認のクラウドセーブがあるときだけ選択させる */
async function syncCloudSave() {
  if (!fbDb || !isGoogleUser(fbUser) || !state) return;
  const uid = fbUser.uid;
  const stillThisUser = () => isGoogleUser(fbUser) && fbUser.uid === uid;
  try {
    const snap = await fbDb.ref(`saves/${uid}`).get();
    if (!stillThisUser()) return;
    const cloud = snap.val();
    if (!cloud?.data) {
      await writeCloudSave(state, uid);
      if (!stillThisUser()) return;
      cloudSaveState = "saved";
      rememberSyncUid(uid);
      fbLastSyncUid = uid;
      updateAuthUi();
      toast("ゲストのセーブをクラウドへ引き継ぎました");
      return;
    }
    if (rememberedSyncUid() === uid) {
      fbLastSyncUid = uid;
      pushCloudSave(state);
      return;
    }
    const cloudDate = cloud.ts ? new Date(cloud.ts).toLocaleString("ja-JP") : "不明";
    const localDate = state.savedAt ? new Date(state.savedAt).toLocaleString("ja-JP") : "不明";
    const loadCloud = await showConfirm({
      title: "クラウドセーブの検出",
      bodyHtml: `<p>このアカウントにはクラウドのセーブ（${escapeHtml(cloudDate)}）があります。</p>
        <p><strong>はい</strong> — クラウドを読み込む（このブラウザのセーブは上書きされます）<br>
        <strong>いいえ</strong> — このブラウザのセーブ（${escapeHtml(localDate)}）をクラウドへアップロード</p>`,
    });
    if (!stillThisUser()) return;
    if (loadCloud) {
      state = JSON.parse(cloud.data);
      migrateState(state);
      applySiteBonuses(state);
      applyStaminaRegen(state);
      rememberSyncUid(uid);
      fbLastSyncUid = uid;
      saveGame(state);
      render();
      toast("クラウドからセーブを読み込みました");
    } else {
      await writeCloudSave(state, uid);
      if (!stillThisUser()) return;
      cloudSaveState = "saved";
      rememberSyncUid(uid);
      fbLastSyncUid = uid;
      updateAuthUi();
      toast("ローカルのセーブをクラウドへアップロードしました");
    }
  } catch (e) {
    fbLastSyncUid = null;
    toast(`クラウド同期に失敗しました（${e.code || e.message}）`);
  }
}

/** 全体チャンネルの表示用。Firebase の共有ログにローカルの指揮官メッセージを混ぜる */
function mergedAllChat() {
  const local = (state.chatLog || []).filter((m) => m.channel === "all" && m.user === "指揮官");
  return [...local, ...fbMessages].sort((a, b) => (a.ts || 0) - (b.ts || 0));
}

function sendFirebaseChat(text) {
  if (!fbDb || !fbAuthed) return false;
  const profile = state.profile || {};
  fbDb.ref("chat/all").push({
    user: String(profile.codename || "Researcher").slice(0, 40),
    text: text.slice(0, 200),
    ts: firebase.database.ServerValue.TIMESTAMP,
  });
  return true;
}

function classColor(cls) { return GAME_DATA.classColors[cls] || "#5a7a98"; }

function catalogArtHtml(catalogId) {
  const cat = GAME_DATA.catalog[catalogId];
  const color = classColor(cat?.class);
  const label = (cat?.scp || catalogId).replace(/^SCP-(Unknown-)?/, "");
  return `<div class="catalog-art" style="border-color:${color}">
    <img src="assets/scp/${catalogId}.png" alt="" draggable="false" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">

  </div>`;
}

  const stamFill = document.getElementById("h-stamina-fill");
  if (stamFill) {
    const stamMax = state.staminaMax || 1;
    stamFill.style.width = `${Math.min(100, Math.round((state.stamina / stamMax) * 100))}%`;
  }
  document.getElementById("h-budget").textContent = state.budget.toLocaleString();
  document.getElementById("h-site").textContent = state.siteLevel;
  document.getElementById("h-floor").textContent = state.floor;
  document.getElementById("h-power").textContent = calcSquadPower(state).toLocaleString();
  document.getElementById("h-stamina-timer").textContent = formatStaminaTimer(state);
  const p = state.profile || {};
  document.getElementById("op-name").textContent = p.codename || "Researcher";
  document.getElementById("op-title").textContent = `Level-${p.clearance || 1} ${p.title || ""}`;
  document.getElementById("op-avatar").textContent = (p.codename || "R").charAt(0);
}

/** 接続中の uid 数。同一 uid の複数タブは 1 人と数える（connId でタブを分ける） */
function countPresenceUids(snap) {
  let n = 0;
  snap.forEach((child) => {
    if (child.hasChildren()) n += 1;
  });
  return n;
}

function attachPresenceListeners() {
  if (!fbDb || presenceListOn) return;
  presenceListOn = true;
  fbDb.ref("presence").on("value", (snap) => {
    fbOnlineCount = countPresenceUids(snap);
    updateChatFooter();
  });
  if (presenceConnectedOn) return;
  presenceConnectedOn = true;
  fbDb.ref(".info/connected").on("value", (snap) => {
    if (!snap.val() || !presenceUid) return;
    claimPresence(presenceUid);
  });
}

function claimPresence(uid) {
  if (!fbDb || !uid) return;
  const connRef = fbDb.ref(`presence/${uid}/${PRESENCE_CONN_ID}`);
  connRef.onDisconnect().remove();
  connRef.set({ ts: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
}

function startPresence(uid) {
  if (!fbDb || !uid) return;
  attachPresenceListeners();
  if (presenceUid && presenceUid !== uid) {
    const oldRef = fbDb.ref(`presence/${presenceUid}/${PRESENCE_CONN_ID}`);
    oldRef.onDisconnect().cancel();
    oldRef.remove().catch(() => {});
  }
  presenceUid = uid;
  claimPresence(uid);
}

function stopPresence() {
  if (fbDb && presenceUid) {
    const ref = fbDb.ref(`presence/${presenceUid}/${PRESENCE_CONN_ID}`);
    ref.onDisconnect().cancel();
    ref.remove().catch(() => {});
  }
  presenceUid = null;
}

function chatNetStatus() {
  if (chatChannel !== "all") return "ローカル";
  if (!fbDb) return "オフライン";
  if (!fbAuthed) return "認証中…";
  return `オンライン ${fbOnlineCount}人`;
}

function updateChatFooter() {
  const el = document.getElementById("chat-footer");
  if (!el || !state) return;
  const n = chatChannel === "all"
    ? mergedAllChat().length
    : (state.chatLog || []).filter((m) => m.channel === chatChannel).length;
  const ch = chatChannel === "all" ? "全体" : "質問";
  el.textContent = `通信網 — ${n} 件 / チャンネル: ${ch} / ${chatNetStatus()}`;
}

function renderChat() {
  const box = document.getElementById("chat-messages");
  if (!box) return;
  const display = chatChannel === "all"
    ? mergedAllChat()
    : (state.chatLog || []).filter((m) => m.channel === chatChannel);
  box.innerHTML = display.map((m) => {
    const whoClass = m.user === "指揮官" ? "cmd" : "";
    const t = new Date(m.ts).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    return `<div class="chat-msg"><span class="who ${whoClass}">${escapeHtml(m.user)}</span><span class="time">${t}</span><div class="text">${escapeHtml(m.text)}</div></div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
  updateChatFooter();
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function render() {
  hideItemHover();
  updateHeader();
  updateAuthUi();
  renderChat();
  const main = document.getElementById("main");
  const views = {
    dashboard: renderDashboard,
    map: renderMap,
    explore: renderExplore,
    site: renderSite,
    equipment: renderEquipment,
    craftGear: () => renderCraftShop("craftGear"),
    craftItem: () => renderCraftShop("craftItem"),
    squad: renderSquad,
    cross: renderCross,
    chamber: renderChamber,
    codex: renderCodex,
    profile: renderProfile,
    items: renderItems,
    roster: renderRoster,
    help: renderHelp,
    board: renderBoard,
    credits: renderCredits,
  };

  main.innerHTML = (currentView !== "dashboard" ? viewHeader() : "") + body;
