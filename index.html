function playBossBattle(result) {
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.className = "battle-overlay";
    const title = result.win ? "収容違反 — 交戦" : "収容違反 — 交戦";
    wrap.innerHTML = `<div class="battle-box">
      <h4>${escapeHtml(title)}</h4>
      <div class="battle-live">
        <div class="battle-sides">
          <div class="battle-col">
            <div class="label">展開チーム</div>
            ${(result.allies || []).map((f) => battleFighterHtml(f, "ally")).join("")}
          </div>
          <div class="battle-col">
            <div class="label">収容違反体</div>
            ${(result.enemies || []).map((f) => battleFighterHtml(f, "enemy")).join("")}
          </div>
        </div>
        <div class="battle-log-live" id="battle-log-live"></div>
      </div>
      <div class="battle-result-layout" data-result-layout hidden>
        <div class="battle-result" data-result></div>
        <div data-result-log></div>
      </div>
      <div class="battle-actions">
        <button type="button" class="btn btn-sm btn-secondary" data-skip>スキップ</button>
        <button type="button" class="btn btn-sm btn-primary" data-done hidden>了解</button>
      </div>
    </div>`;
    document.body.appendChild(wrap);
    const logBox = wrap.querySelector("#battle-log-live");
    const skipBtn = wrap.querySelector("[data-skip]");
    const doneBtn = wrap.querySelector("[data-done]");
    const events = result.events || [];
    let i = 0;
    let timer = 0;
    let finished = false;

    const appendLog = (ev) => {
      if (!ev?.text) return;
      const div = document.createElement("div");
      div.className = ev.type === "hit" && ev.crit ? "crit" : (ev.type || "note");
      if (ev.type === "end") div.classList.add(ev.win ? "win" : "lose");
      div.textContent = ev.text;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    };

    const apply = (ev) => {
      if (ev.type === "hit" || ev.type === "heal" || ev.type === "ko") {
        setBattleHp(wrap, ev.targetId, ev.hp ?? 0, ev.maxHp || 1);
      }
      appendLog(ev);
    };

    const finish = () => {
      if (finished) return;
      finished = true;
      clearInterval(timer);
      while (i < events.length) apply(events[i++]);
      for (const line of result.log || []) {
        const last = logBox.lastElementChild;
        if (last && last.textContent === line) continue;
        const exists = [...logBox.children].some((n) => n.textContent === line);
        if (exists) continue;
        const div = document.createElement("div");
        if (line.includes("成功")) div.className = "end win";
        else if (line.includes("失敗")) div.className = "end lose";
        div.textContent = line;
        logBox.appendChild(div);
      }
      logBox.scrollTop = logBox.scrollHeight;
      wrap.querySelector(".battle-box").classList.add("wide");
      wrap.querySelector(".battle-live").hidden = true;
      const layout = wrap.querySelector("[data-result-layout]");
      layout.hidden = false;
      logBox.classList.add("result-log");
      wrap.querySelector("[data-result-log]").appendChild(logBox);
      const pane = wrap.querySelector("[data-result]");
      pane.innerHTML = battleResultHtml(result);
      const heading = wrap.querySelector("h4");
      heading.textContent = result.win ? "リザルト — 制圧成功" : "リザルト — 撤退";
      heading.classList.toggle("win", !!result.win);
      skipBtn.hidden = true;
      doneBtn.hidden = false;
    };

    const tick = () => {
      if (i >= events.length) {
        finish();
        return;
      }
      apply(events[i++]);
    };

    skipBtn.onclick = finish;
    doneBtn.onclick = () => { wrap.remove(); resolve(); };
    timer = setInterval(tick, 160);
    tick();
  });
}

function doCross() {
  if (!crossParentA || !crossParentB) return;
  const r = crossTest(state, crossParentA, crossParentB);
  toast(r.msg);
  if (r.ok) {
    crossParentA = null; crossParentB = null;
    saveGame(state); render();
  }
}

function pickCross(uid) {
  if (crossJustDragged) { crossJustDragged = false; return; }
  if (crossParentA === uid) { crossParentA = null; render(); return; }
  if (crossParentB === uid) { crossParentB = null; render(); return; }
  if (!crossParentA) crossParentA = uid;
  else if (!crossParentB) crossParentB = uid;
  else crossParentA = uid;
  render();
}

function dropCrossParent(slot, uid) {
  if (slot === "A") {
    if (crossParentB === uid) crossParentB = null;
    crossParentA = uid;
  } else if (slot === "B") {
    if (crossParentA === uid) crossParentA = null;
    crossParentB = uid;
  }
  render();
}

function bindCrossDrag() {
  document.querySelectorAll("#cross-pick .unit-card[data-uid], .fusion-box .unit-card[data-uid]").forEach((el) => {
    el.querySelectorAll("img").forEach((img) => { img.draggable = false; });
    el.addEventListener("dragstart", (e) => {
      const from = el.closest("[data-cross-slot]");
      dragPayload = { src: "cross", uid: Number(el.dataset.uid), fromSlot: from ? from.dataset.crossSlot : null };
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(el.dataset.uid));
    });
    el.addEventListener("dragend", () => {
      dragPayload = null;
      el.classList.remove("dragging");
      crossJustDragged = true;
    });
  });
  document.querySelectorAll(".fusion-box .unit-card[data-uid]").forEach((el) => {
    el.onclick = () => {
      if (crossJustDragged) { crossJustDragged = false; return; }
      const slot = el.closest("[data-cross-slot]")?.dataset.crossSlot;
      if (slot === "A") crossParentA = null;
      if (slot === "B") crossParentB = null;
      render();
    };
  });

  document.querySelectorAll("[data-cross-slot]").forEach((box) => {
    box.addEventListener("dragover", (e) => {
      e.preventDefault();
      box.classList.add("over");
    });
    box.addEventListener("dragleave", () => box.classList.remove("over"));
    box.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      box.classList.remove("over");
      const uid = dragPayload?.src === "cross" ? dragPayload.uid : Number(e.dataTransfer.getData("text/plain"));
      if (!uid) return;
      dropCrossParent(box.dataset.crossSlot, uid);
    });
  });

  const pick = document.getElementById("cross-pick");
  if (pick) {
    pick.addEventListener("dragover", (e) => {
      if (dragPayload?.src !== "cross" || !dragPayload.fromSlot) return;
      e.preventDefault();
    });
    pick.addEventListener("drop", (e) => {
      e.preventDefault();
      if (dragPayload?.src !== "cross" || !dragPayload.fromSlot) return;
      if (dragPayload.fromSlot === "A") crossParentA = null;
      if (dragPayload.fromSlot === "B") crossParentB = null;
      render();
    });
  }
}

function removeChamber(uid) { state.chamber = state.chamber.filter((id) => id !== uid); saveGame(state); render(); }

function reclassSelected() {
  if (selectedUnits.length !== 1) { toast("1体を選択"); return; }
  const r = reclassifyUnit(state, selectedUnits[0]); toast(r.msg);
  if (r.ok) { saveGame(state); render(); }
}
function equipSelected() {
  if (selectedUnits.length !== 1) { toast("1体を選択"); return; }
  const art = GAME_DATA.artifacts.find((a) => storageCount(state, a.id) > 0);
  if (!art) { toast("アーティファクトなし"); return; }
  const r = equipArtifact(state, selectedUnits[0], art.id); toast(r.msg);
  if (r.ok) { saveGame(state); render(); }
}
function sellArt(id) {
  const r = sellArtifact(state, id); toast(r.msg);
  if (r.ok) { saveGame(state); render(); }
}
function craft(id) {
  const meta = itemMeta(id);
  if (!meta?.craft) {
    toast("製作できないアイテムです");
    return;
  }
  showCraftConfirm(state, meta).then((qty) => {
    if (!qty) return;
    const r = craftItem(state, id, qty);
    toast(r.msg);
    if (r.ok) { saveGame(state); render(); }
  });
}
function doCatalog() {
  const sel = document.getElementById("catalog-select");
  if (!sel) return;
  const obj = GAME_DATA.recoveryObjects.find((o) => storageCount(state, o.id) > 0);
  if (!obj) { toast("素材なし（倉庫に収容アイテムがありません）"); return; }
  const r = catalogUnit(state, sel.value, [obj.id]);
  toast(r.msg);
  if (r.ok) { saveGame(state); render(); }
}

function initChat() {
  const authBtn = document.getElementById("btn-auth");
  if (authBtn) authBtn.onclick = handleAuthButton;
  document.querySelectorAll("#chat-tabs button").forEach((btn) => {
    btn.onclick = () => {
      chatChannel = btn.dataset.channel;
      document.querySelectorAll("#chat-tabs button").forEach((b) => b.classList.toggle("active", b === btn));
      renderChat();
    };
  });
  const send = () => {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    if (chatChannel === "all" && sendFirebaseChat(text)) {
      input.value = "";
      return;
    }
    if (sendChat(state, text, chatChannel === "question" ? "question" : "all")) {
      input.value = "";
      saveGame(state);
      renderChat();
    }
  };
  document.getElementById("chat-send").onclick = send;
  document.getElementById("chat-input").onkeydown = (e) => { if (e.key === "Enter") send(); };
}

function init() {
  setTimeout(() => {
    document.getElementById("splash").classList.add("hidden");
    state = loadGame();
    if (!state) state = createNewState();
    migrateState(state);
    applySiteBonuses(state);
    if (!state.acceptedLicense) {
      document.getElementById("license-screen").classList.remove("hidden");
    } else {
      document.getElementById("app").classList.remove("hidden");
      initFirebaseChat();
      initChat();
      render();
    }
  }, 1200);

  document.getElementById("btn-accept-license").onclick = () => {
    state.acceptedLicense = true;
    saveGame(state);
    document.getElementById("license-screen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    initFirebaseChat();
    initChat();
    render();
  };

  setInterval(() => {
    if (state && !document.getElementById("app").classList.contains("hidden")) updateHeader();
  }, 1000);
}

init();
bindItemHover();
</script>
</body>
