/* --- 区画スキャンマップ --- */
let sectorSim = null;
let sectorRaf = null;
let sectorLastTs = 0;
let sectorSaveTimer = 0;
let bossPlayback = false;

function syncSectorLoop() {
  if (limitedExtractLock) {
    stopSectorLoop();
    return;
  }
  const floorData = currentFloorData(state);
  const squadKey = `op|${(state.squad || []).join(",")}`;
  const mapSite = state.mapSite || defaultMapSiteId();
  // 整理画面でも巡回を止めない。入手アイテムは裏で増え続ける
  if (!sectorSim || sectorSim.depth !== floorData.depth || sectorSim.squadKey !== squadKey || sectorSim.mapSite !== mapSite) {
    sectorSim = createSectorSim(state, floorData);
  }
  renderReconLog();
  if (sectorRaf === null) {
    sectorLastTs = performance.now();
    sectorRaf = requestAnimationFrame(sectorFrame);
  }
}

function stopSectorLoop() {
  if (sectorRaf !== null) {
    cancelAnimationFrame(sectorRaf);
    sectorRaf = null;
  }
}

function sectorFrame(ts) {
  if (!sectorSim) {
    sectorRaf = null;
    return;
  }
  const dt = Math.min(0.05, (ts - sectorLastTs) / 1000);
  sectorLastTs = ts;
  const canvas = document.getElementById("sector-canvas");

  if (bossPlayback) {
    if (canvas) drawSector(canvas.getContext("2d"), sectorSim);
    sectorRaf = requestAnimationFrame(sectorFrame);
    return;
  }

  if (limitedRunNeedsExtract(state)) {
    if (bossPlayback) {
      sectorRaf = requestAnimationFrame(sectorFrame);
      return;
    }
    beginLimitedRunExtract();
    return;
  }
  updateLimitedMapHud();

  const { changed, breach, bossHit, wiped } = updateSectorSim(sectorSim, state, dt);
  if (canvas) drawSector(canvas.getContext("2d"), sectorSim);

  if (bossHit) {
    beginBossPlayback();
    sectorRaf = requestAnimationFrame(sectorFrame);
    return;
  }
  if (wiped) {
    beginHqRecall();
    sectorRaf = requestAnimationFrame(sectorFrame);
    return;
  }
  if (breach) {
    toast(breach.win ? `収容違反体を制圧 — 深度 ${state.floor} へ` : "収容違反体に敗北 — 編成を見直してください");
    sectorRaf = null;
    render();
    return;
  }
  if (changed) {
    renderReconLog();
    updateHeader();
    refreshPendingLive();
    sectorSaveTimer = 0;
  }
  updateRevealHud();
  updateSentryAmmoHud();
  sectorSaveTimer += dt;
  if (sectorSaveTimer > 5 && (sectorSim.contacts > 0 || (state.revealedRooms || []).length > 0)) {
    saveGame(state);
    sectorSaveTimer = 0;
  }

  sectorRaf = requestAnimationFrame(sectorFrame);
}

function renderReconLog() {
  const box = document.getElementById("recon-log");
  updateRevealHud();
  if (!box || !sectorSim) return;
  const counter = document.getElementById("sector-contacts");
  if (counter) counter.textContent = `接触 ${sectorSim.contacts}`;
  updateClearGauge();
  if (!sectorSim.events.length) return;
  box.innerHTML = sectorSim.events.slice(-20).reverse()
    .map((e) => `<div class="contact">${escapeHtml(e)}</div>`).join("");
  box.scrollTop = 0;
}

function updateRevealHud() {
  const el = document.getElementById("sector-reveal");
  if (!el || !sectorSim) return;
  const total = sectorSim.sector.rooms.length;
  const n = sectorSim.revealed instanceof Set ? sectorSim.revealed.size : 0;
  const pct = total ? Math.floor((n / total) * 100) : 0;
  el.textContent = `解明 ${n}/${total}  ${pct}%`;
}

/** MAP 右の残弾表示。弾数・弾切れ状態が変わったときだけ DOM を組み直す */
function updateSentryAmmoHud(force) {
  const col = document.getElementById("sentry-ammo-col");
  if (!col) {
    sentryAmmoHudKey = "";
    return;
  }
  const list = state.sentries || [];
  const ammoMax = sentryAmmoMaxOf(state);
  const key = list.map((s) => `${s.ammo}|${(s.ammo || 0) <= 0 ? 1 : 0}`).join(";");
  if (!force && key === sentryAmmoHudKey) return;
  sentryAmmoHudKey = key;
  if (!list.length) {
    col.hidden = true;
    col.innerHTML = "";
    return;
  }
  col.hidden = false;
  col.innerHTML = list.map((s, i) => {
    const ammo = typeof s.ammo === "number" ? s.ammo : ammoMax;
    const empty = ammo <= 0;
    const pct = Math.max(0, Math.round((ammo / ammoMax) * 100));
    const title = list.length > 1 ? `セントリーガン残弾数 #${i + 1}` : "セントリーガン残弾数";
    return `<div class="sentry-ammo-card${empty ? " empty" : ""}">
      <div class="ammo-title">${title}</div>
      <div class="ammo-count">${ammo}/${ammoMax}</div>
      <div class="meter-bar"><div class="meter-fill green" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");
}

/** 診断バナーを閉じた時点の連敗数。次に負けると再表示される */
let adviceDismissedLosses = -1;

function adviceVisible() {
  return (state.breachLosses || 0) !== adviceDismissedLosses;
}

/** 診断バナーとクールダウン表示をまとめて引っ込める */
function dismissAdvice() {
  adviceDismissedLosses = state.breachLosses || 0;
  document.querySelector(".breach-advice")?.remove();
  updateClearGauge();
}

function clearGaugeLabel() {
  if (state.sectorCleared) return "区画制圧率 — 制圧済み";
  if (isBreachReady(state)) return "区画制圧率 — MAX";
  const cooldown = Math.ceil(((state.breachCooldownUntil || 0) - Date.now()) / 1000);
  if (cooldown > 0 && adviceVisible()) return `区画制圧率 — ${cooldown} 秒`;
  return "区画制圧率";
}

/** 掃討率ゲージは再描画せず直接更新する（毎接触で render すると重い） */
function updateClearGauge() {
  const gauge = document.getElementById("clear-gauge");
  if (!gauge) return;
  const need = killsNeeded(state.floor);
  const kills = Math.min(state.clearKills, need);
  const ready = isBreachReady(state);
  document.getElementById("clear-count").textContent = `${kills} / ${need}`;
  const fill = document.getElementById("clear-fill");
  fill.style.width = `${Math.round((kills / need) * 100)}%`;
  fill.className = `meter-fill ${ready || state.sectorCleared ? "red" : "teal"}`;
  document.getElementById("clear-label").textContent = clearGaugeLabel();
  gauge.classList.toggle("breach", ready && !sectorSim?.boss);
  const btn = document.getElementById("btn-boss");
  if (btn) {
    const hunting = !!(sectorSim?.boss || bossPlayback);
    btn.disabled = !ready || hunting;
    btn.textContent = hunting ? "接近中" : "BOSS挑戦";
  }
}

function meterBar(label, value, max, cssClass, suffix = "", title = "") {
  const pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
  const tip = title ? ` title="${escapeHtml(title)}"` : "";
  return `<div class="meter"${tip}>
    <div class="meter-head"><span>${label}</span><span>${value}${suffix} / ${max}${suffix}</span></div>
    <div class="meter-bar"><div class="meter-fill ${cssClass}" style="width:${pct}%"></div></div>
  </div>`;
}

/** 司令室に出す未整理の代表。レア度が高い順に最大5件 */
function lootSummaryHtml() {
  if (!state.pending.length) {
    return `<span style="font-size:11px;color:rgb(var(--color-text-muted))">未整理なし</span>`;
  }
  const ranked = [...state.pending].sort((a, b) => {
    const rankDiff = (RARITY_RANK[entryRarity(b)] ?? 0) - (RARITY_RANK[entryRarity(a)] ?? 0);
    if (rankDiff) return rankDiff;
    return (b.qty || 0) - (a.qty || 0);
  });
  const top = ranked.slice(0, 5);
  const rest = ranked.length - top.length;
  const icons = top.map((e) => {
    const r = entryRarity(e);
    const name = itemName(e.id);
    return `<span class="loot-icon r-${r}" title="${escapeHtml(name)} ×${e.qty} — ${rarityStars(r)}">
      <img src="assets/item/${e.id}.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <span class="ph">${escapeHtml(name.slice(0, 1))}</span>
      <span class="qty">${e.qty}</span>
    </span>`;
  }).join("");
  const more = rest > 0
    ? `<span class="loot-icon more" title="他 ${rest} 種">+${rest}</span>`
    : "";
  return icons + more;
}

function incidentLogHtml() {
  return (state.battleLog || []).map((l) => {
    if (l.includes("成功")) return `<div class="win">${l}</div>`;
    if (l.includes("失敗")) return `<div class="lose">${l}</div>`;
    return `<div>${l}</div>`;
  }).join("");
}

function siteLabel(s) {
  return s.alias ? `${s.name}（${s.alias}）` : s.name;
}

function updateLimitedMapHud() {
  const remain = limitedRunRemainMs(state);
  const clock = document.getElementById("sector-run-clock");
  if (clock) {
    const num = clock.querySelector("[data-run-clock-num]");
    if (num) num.textContent = formatRunClock(remain);
    clock.classList.toggle("warn", remain > 0 && remain <= 60000);
  }
  document.querySelectorAll("[data-run-timer]").forEach((el) => {
    el.textContent = remain > 0 ? formatRunClock(remain) : "活動終了";
    const poi = el.closest(".map-poi");
    if (poi) poi.classList.toggle("locked", remain <= 0);
  });
}

function renderMap() {
  const current = currentMapSite(state).id;
  const runActive = isLimitedRunActive(state);
  const runSiteId = state.limitedRun?.siteId;
  const pois = GAME_DATA.mapSites.map((s) => {
    const prog = siteProgressOf(state, s.id);
    const thisRun = runActive && runSiteId === s.id;
    const locked = s.limited && !thisRun;
    const away = runActive && s.id !== runSiteId;
    let clock;
    if (s.limited && thisRun) {
      clock = `<small>活動限界</small><small class="limited-clock" data-run-timer>${formatRunClock(limitedRunRemainMs(state))}</small>`;
    } else if (s.limited) {
      clock = `<small>要解放</small><small class="limited-clock">粒子×1 セル×1</small>`;
    } else {
      clock = `<small>${escapeHtml(s.kindLabel)} · ${floorName(prog.floor)}</small>`;
    }
    const title = s.limited
      ? `${siteLabel(s)} — ${s.desc} ${thisRun ? formatRunClock(limitedRunRemainMs(state)) : "異常粒子×1・電源セル×1で1回解放"}`
      : `${siteLabel(s)} — ${s.desc} ${floorName(prog.floor)}`;
    return `<button type="button" class="map-poi${s.id === current && !state.ospreyAtHq ? " active" : ""}${s.limited ? " limited" : ""}${locked ? " locked" : ""}${away ? " dim" : ""}" data-map-site="${s.id}" style="left:${s.x}%;top:${s.y}%" title="${escapeHtml(title)}">
      <span class="pin"></span>
      <span class="tag">${escapeHtml(s.code)}${clock}</span>
    </button>`;
  }).join("");
  const cur = currentMapSite(state);
  const hq = GAME_DATA.forwardHq;
  const ospreyAt = (state.ospreyAtHq && hq) ? hq : cur;
  const hqPin = hq
    ? `<div class="map-hq" style="left:${hq.x}%;top:${hq.y}%" title="${escapeHtml(hq.name)} — ${escapeHtml(hq.desc)}">
      <span class="pin"></span>
      <span class="tag">${escapeHtml(hq.code)}<small>${escapeHtml(hq.name)}</small></span>
    </div>`
    : "";
  const runHint = cur.limited
    ? (isLimitedRunActive(state, cur.id)
      ? `<span class="kind">活動限界 ${formatRunClock(limitedRunRemainMs(state))}</span>`
      : `<span class="kind">要 異常粒子×1 / 電源セル×1</span>`)
    : "";
  return `<div class="panel city-map-panel">
    ${rarityHudHtml(state.floor)}
    <p class="city-map-note">JP-81 // 地点クリックで展開確認。金色ピンは時限観測点（異常粒子×1・電源セル×1で10分・1回）。全滅時は前線指揮所（HQ）からオスプレイ再展開。</p>
    <div class="city-map">
      <img src="assets/map/SCP-TOKYO.jpg" alt="SCP-Unknown TOKYO">
      ${pois}
      ${hqPin}
      <div id="map-osprey" class="map-osprey" style="left:${ospreyAt.x}%;top:${ospreyAt.y}%" title="展開中オスプレイ">
        <img src="assets/map/osprey.png" alt="オスプレイ">
      </div>
    </div>
    <div class="map-site-blurb">
      <strong>${escapeHtml(state.ospreyAtHq && hq ? hq.name : siteLabel(cur))}</strong>
      <span class="kind">${escapeHtml(state.ospreyAtHq && hq ? hq.code : cur.kindLabel)}</span>
      ${runHint}
      <p>${escapeHtml(state.ospreyAtHq && hq ? hq.desc : cur.desc)}</p>
    </div>
  </div>`;
}

/** オスプレイを目標地点へ飛ばしてから done。同一座標なら即 done */
function flyOspreyTo(site, done) {
  const el = document.getElementById("map-osprey");
  if (!el) { done(); return; }
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    el.removeEventListener("transitionend", onEnd);
    done();
  };
  const onEnd = (e) => {
    if (e.propertyName !== "left" && e.propertyName !== "top") return;
    finish();
  };
  el.addEventListener("transitionend", onEnd);
  el.classList.add("fly");
  void el.offsetWidth;
  el.style.left = `${site.x}%`;
  el.style.top = `${site.y}%`;
  setTimeout(finish, 1100);
}

/** 全滅後、ステージMAPの前線指揮所から現在地点へオスプレイを飛ばして再開する */
function beginHqRecall() {
  if (hqRecallLock) return;
  hqRecallLock = true;
  mapDeployLock = true;
  const site = currentMapSite(state);
  const hq = GAME_DATA.forwardHq;
  goView("map");
  const el = document.getElementById("map-osprey");
  if (el && hq) {
    el.classList.remove("fly");
    el.style.transition = "none";
    el.style.left = `${hq.x}%`;
    el.style.top = `${hq.y}%`;
    void el.offsetWidth;
    el.style.transition = "";
  }
  toast("展開チームが撤退 — 前線指揮所へ再展開");
  flyOspreyTo(site, () => {
    mapDeployLock = false;
    hqRecallLock = false;
    if (limitedExtractLock) return;
    if (sectorSim) {
      sectorSim.respawnAt = sectorSim.time;
      respawnTeamIfReady(sectorSim);
    }
    goView("dashboard");
  });
}

function confirmMapSite(siteId) {
  if (mapDeployLock) return;
  const site = GAME_DATA.mapSites.find((s) => s.id === siteId);
  if (!site) return;
  if (isLimitedRunActive(state) && state.limitedRun.siteId !== site.id) {
    toast("活動限界まで観測点から離脱できません");
    return;
  }
  const current = currentMapSite(state);
  const same = site.id === current.id && !state.ospreyAtHq;
  const needUnlock = site.limited && !isLimitedRunActive(state, site.id);
  if (needUnlock) {
    const cost = limitedUnlockCost(site);
    const lack = materialsLack(state, cost);
    const can = lack.length === 0;
    const mats = Object.entries(cost).map(([id, n]) => confirmNeedItemHtml(id, n)).join("");
    showConfirm({
      title: "時限観測点を解放",
      bodyHtml: `<p>${escapeHtml(siteLabel(site))} へ展開します。活動限界は10分、1回です。${can ? "" : "必要数が足りません。"}</p>
        <div class="confirm-craft-mats">${mats}</div>`,
      okOnly: !can,
    }).then((ok) => {
      if (!ok || !can) return;
      deployToMapSite(site, same);
    });
    return;
  }
  const body = same
    ? `${siteLabel(site)} の区画探索を開始しますか。`
    : `${siteLabel(site)} へオスプレイを展開しますか。`;
  showConfirm({ title: same ? "区画探索" : "展開確認", body }).then((ok) => {
    if (!ok) return;
    deployToMapSite(site, same);
  });
}

function deployToMapSite(site, same) {
  const go = () => {
    mapDeployLock = false;
    if (currentView !== "map") return;
    const r = selectMapSite(state, site.id);
    toast(r.msg);
    if (r.ok) {
      sectorSim = null;
      goView("dashboard");
    }
  };
  if (same) { go(); return; }
  mapDeployLock = true;
  flyOspreyTo(site, go);
}

function maybeBeginLimitedExtract() {
  if (!state || limitedExtractLock || bossPlayback) return;
  if (limitedRunNeedsExtract(state)) beginLimitedRunExtract();
}

/** 活動限界 → 入手リザルト → 前線指揮所のステージ選択 */
function beginLimitedRunExtract() {
  if (limitedExtractLock) return;
  limitedExtractLock = true;
  mapDeployLock = false;
  stopSectorLoop();
  sectorSim = null;
  if (state.limitedRun) state.limitedRun.until = Date.now();
  saveGame(state);
  const loot = (state.limitedRun?.loot || []).map((x) => ({ id: x.id, qty: x.qty }));
  showConfirm({ title: "活動限界", body: "活動限界のため帰還します。", okOnly: true }).then(() => {
    return showLimitedLootResult(loot);
  }).then(() => {
    concludeLimitedRun(state);
    saveGame(state);
    limitedExtractLock = false;
    goView("map");
  });
}

function showLimitedLootResult(loot) {
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.className = "confirm-overlay";
    wrap.id = "limited-loot-overlay";
    const chips = loot.length
      ? loot.map((it) => `<span class="result-chip">
          <img src="assets/item/${it.id}.png" alt="" onerror="this.style.opacity='0.2'">
          ${escapeHtml(itemName(it.id))} <b>×${it.qty || 1}</b>
        </span>`).join("")
      : `<span class="result-empty">入手なし</span>`;
    wrap.innerHTML = `<div class="confirm-box wide limited-loot-box">
      <h4>時限観測 — 回収記録</h4>
      <p>この観測で入手した物品です。</p>

}

function renderEquipment() {
  const { stats, skills } = operatorDisplayStats(state);

  const statKeys = [
    ["hp", "HP"], ["atk", "物攻"], ["anm", "異能"],
    ["def", "防御"], ["spd", "機動"], ["luck", "運"],
  ];
  const statHtml = statKeys.map(([k, label]) => {
    const raw = stats[k] | 0;
    const shown = Math.min(statMax, Math.max(0, raw));
    const pct = Math.round((shown / statMax) * 100);
    return `<div class="equip-stat s-${k}">
      <span>${label}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <b>${shown}/${statMax}</b>
    </div>`;
  }).join("");
  const skillHtml = skills.length
    ? skills.map((s) => `<div class="sk"><strong>${escapeHtml(s.name)}</strong> — ${escapeHtml(s.desc)}</div>`).join("")
    : `<div class="sk">固有スキルなし</div>`;

  const slotsHtml = GAME_DATA.gearSlots.map((slot) => {
    const piece = gearPieceOf(state.operatorGear?.[slot.id]);
    const id = piece?.id;
    const meta = id ? itemMeta(id) : null;
    const lv = piece?.lv || 0;
    const active = equipPickSlot === slot.id ? " active" : "";
    const wType = slot.id === "mainWeapon" && id ? weaponTypeOf(id) : null;
    const partBadge = id ? partBadgeHtml(id) : "";
    const itemLine = meta
      ? `${partBadge}${escapeHtml(meta.name)}<span class="stars">${rarityStars(meta.rarity)}</span><span class="lv-badge">Lv.${lv}</span>`
      : `<span class="empty">未装備</span>`;
    const icon = meta
      ? `<img class="icon" src="assets/item/${id}.png" alt="" onerror="this.style.opacity='0.2'">`
      : `<span class="icon empty"></span>`;
    // アタッチ表示は武器個体（uid）のロードアウト参照。銃のみ装着可、刃は不可表示
    let attachIcons = `<span class="equip-att-row"></span>`;
    if (slot.id === "mainWeapon" && piece) {
      if (wType === "gun") {
        attachIcons = attachIconsRowHtml(state, piece.uid, "equip-att-row");
      } else {
        attachIcons = `<span class="equip-att-row att-na" title="刃にはアタッチメントを装着できません">アタッチ不可</span>`;

    }
    const actions = meta
      ? `<div class="equip-slot-actions">
          <button type="button" class="btn btn-sm btn-accent" data-enhance-slot="${slot.id}">強化</button>
          <button type="button" class="btn btn-sm btn-secondary" data-unequip-slot="${slot.id}">外す</button>

            ? `<button type="button" class="btn btn-sm btn-primary" data-att-uid="${piece.uid}">アタッチメント装備</button>`
            : ""}
        </div>`
      : `<div class="equip-slot-actions"></div>`;
    return `<div class="equip-slot-row">
      <div class="equip-slot${active}" data-equip-slot="${slot.id}"${id ? ` data-item-hover="${id}" data-hover-slot="${slot.id}"` : ""}>
        ${icon}
        <span class="slot-name">${slot.name}</span>
        <span class="slot-item">${itemLine}</span>
        ${attachIcons}
        <span class="slot-name">${id ? "変更" : "選択"}</span>
      </div>
      ${actions}
    </div>`;
  }).join("");

  let pickHtml = "";
  if (equipPickSlot) {
    const slot = GAME_DATA.gearSlots.find((s) => s.id === equipPickSlot);
    const equippedPiece = gearPieceOf(state.operatorGear?.[equipPickSlot]);
    const equippedMeta = equippedPiece ? itemMeta(equippedPiece.id) : null;
    const rows = [];
    if (equippedMeta) {
      rows.push(equipPickRowHtml(equippedMeta, 0, true, null, equippedPiece, -1));
    }
    const filtered = filteredGearCandidates(state, equipPickSlot);
    for (const c of filtered) {
      rows.push(equipPickRowHtml(c.meta, c.qty, false, equippedMeta, c, c.index));
    }
    const rarityTabs = ["ALL", "SS", "S", "A", "B", "C", "D", "E"].map((t) =>
      `<button type="button" class="${equipRarityTab === t ? "active" : ""}" data-equip-rtab="${t}">${t === "ALL" ? "すべて" : rarityStars(t)}</button>`
    ).join("");
    const sorts = [
      ["rarity", "★"],
      ["atk", "物攻"],
      ["anm", "異能"],
      ["def", "防御"],
      ["hp", "HP"],
      ["name", "名前"],
    ].map(([id, label]) =>
      `<button type="button" class="${equipSortBy === id ? "active" : ""}" data-equip-sort="${id}">${label}</button>`
    ).join("");
    const emptyMsg = filtered.length
      ? ""
      : `<p style="font-size:12px;color:rgb(var(--color-text-muted))">${gearCandidates(state, equipPickSlot).length ? "この条件に合う装備がありません。" : "この枠に入る装備が倉庫にありません。拠点の装備制作で作成してください。"}</p>`;
    const wtTabs = equipPickSlot === "mainWeapon"
      ? `<div class="rarity-tabs">${[["ALL", "すべて"], ["gun", "銃"], ["blade", "刃"]].map(([t, label]) =>
          `<button type="button" class="${equipWeaponTypeTab === t ? "active" : ""}" data-equip-wtab="${t}">${label}</button>`
        ).join("")}</div>`
      : "";
    pickHtml = `<div class="equip-pick panel" style="margin-top:12px">
      <h3>${slot ? slot.name : ""} — 装備選択</h3>
      ${wtTabs}
      <div class="rarity-tabs">${rarityTabs}</div>
      <div class="sort-tools">
        ${sorts}
        <button type="button" class="${equipSkillOnly ? "active" : ""}" id="equip-skill-only">スキルあり</button>
      </div>
      ${rows.join("")}${emptyMsg}
    </div>`;
  }

  return `<div class="equip-screen">
    <div class="equip-hero">
      <img src="assets/user/user.jpg" alt="オペレーター">
      <div class="equip-stats">${statHtml}</div>

      <div class="equip-slot-list">${slotsHtml}</div>

      </p>
    </div>
  </div>`;
}

function filteredGearCandidates(state, slotId) {
  let list = gearCandidates(state, slotId);
  if (equipRarityTab !== "ALL") {
    list = list.filter((c) => c.meta?.rarity === equipRarityTab);
  }
  if (equipSkillOnly) {
    list = list.filter((c) => c.meta?.skill);
  }
  if (slotId === "mainWeapon" && equipWeaponTypeTab !== "ALL") {
    list = list.filter((c) => weaponTypeOf(c.meta?.id) === equipWeaponTypeTab);
  }
  list.sort((a, b) => {
    if (equipSortBy === "name") return a.meta.name.localeCompare(b.meta.name, "ja");
    if (equipSortBy === "atk" || equipSortBy === "anm" || equipSortBy === "def" || equipSortBy === "hp") {
      const diff = (flattenGearStat(b.meta.stat)[equipSortBy] || 0)
        - (flattenGearStat(a.meta.stat)[equipSortBy] || 0);
      if (diff) return diff;
    }
    const rankDiff = (RARITY_RANK[b.meta.rarity] ?? 0) - (RARITY_RANK[a.meta.rarity] ?? 0);
    if (rankDiff) return rankDiff;
    return a.meta.name.localeCompare(b.meta.name, "ja");
  });
  return list;
}

function equipPickRowHtml(meta, qty, equipped, currentMeta, pieceOrCand, fromIndex) {
  if (!meta) return "";
  const skill = meta.skill
    ? `<div class="sk">固有: ${escapeHtml(meta.skill.name)} — ${escapeHtml(meta.skill.desc)}</div>`
    : "";
  const lv = pieceOrCand?.lv || 0;
  const uid = pieceOrCand?.uid || null;
  const action = equipped
    ? `data-unequip-slot="${equipPickSlot}"`
    : `data-equip-id="${meta.id}" data-equip-index="${fromIndex}"`;
  const nextStat = equipped
    ? pieceCombatStatFull(state, pieceOrCand)
    : pieceCombatStatFull(state, makeGearPiece(meta.id, lv, uid));
  const currentStat = currentMeta ? pieceCombatStatFull(state, gearPieceOf(state.operatorGear?.[equipPickSlot])) : null;
  const statsHtml = equipped
    ? escapeHtml(formatItemStats(nextStat))
    : formatItemStatsCompare(nextStat, currentStat);
  const partBadge = partBadgeHtml(meta.id);
  const wt = weaponTypeOf(meta.id);
  const attRow = (wt === "gun" && uid) ? attachIconsRowHtml(state, uid, "pick-att-row") : "";

function gradeColor(id) {
  return GAME_DATA.rarities[itemRarity(id)]?.color || "#7a8290";
}

function slotHtml(entry, src, index) {
  if (!entry) return `<div class="slot empty"></div>`;
  const { id, qty } = entry;
  const r = entryRarity(entry);
  const extra = src === "parts" ? ` data-id="${id}"` : "";
  const canDrag = qty > 0;
  const rollTip = entry.rolls ? ` / ${formatAttachStatLine(entry)}` : "";
  const partName = gearPartName(id);
  const partTag = partName ? `<span class="part">${escapeHtml(partName)}</span>` : "";
  return `<div class="slot r-${r}${canDrag ? "" : " empty"}"${canDrag ? ` draggable="true"` : ""}
    data-src="${src}" data-index="${index}"${extra}
    title="${escapeHtml(itemName(id))}${partName ? ` / ${partName}` : ""} — ${rarityStars(r)}${rollTip} / 単価 ${itemValue(id)}">
    <span class="grade">${rarityStars(r)}</span>
    <img class="icon" src="assets/item/${id}.png" alt="" draggable="false" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="nm">${escapeHtml(itemName(id))}</span>
    ${partTag}
    <span class="qty">${qty}</span>
  </div>`;
}

let itemsSortBy = "rarity";
let itemsRarityTab = "ALL";
let itemsPartTab = "ALL";

function sortedStorageEntries() {
  const filled = [];
  const empty = [];
  state.storage.forEach((e, i) => {
    if (e) filled.push({ e, i });
    else empty.push({ e: null, i });
  });
  const rank = (entry) => RARITY_RANK[entryRarity(entry)] ?? 0;
  filled.sort((a, b) => {
    if (itemsSortBy === "name") return itemName(a.e.id).localeCompare(itemName(b.e.id), "ja");
    if (itemsSortBy === "qty") return b.e.qty - a.e.qty;
    if (itemsSortBy === "value") return itemValue(b.e.id) * b.e.qty - itemValue(a.e.id) * a.e.qty;
    return rank(b.e) - rank(a.e) || itemName(a.e.id).localeCompare(itemName(b.e.id), "ja");
  });
  const list = filled.filter(({ e }) => {
    if (itemsRarityTab !== "ALL" && entryRarity(e) !== itemsRarityTab) return false;
    if (itemsPartTab !== "ALL" && gearPartFilterId(e.id) !== itemsPartTab) return false;
    return true;
  });
  if (itemsRarityTab === "ALL" && itemsPartTab === "ALL") return list.concat(empty);
  return list;
}

function pendingSlotsHtml() {
  if (!state.pending.length) {
    return `<div style="grid-column:1/-1;font-size:12px;color:rgb(var(--color-text-muted))">未整理のアイテムはありません</div>`;
  }
  return state.pending.map((e, i) => slotHtml(e, "pending", i)).join("");
}

      <div class="parts-row" id="grid-parts">${partSlots}</div>

    <div class="sort-col">
      <h3>入手アイテム<span class="cap" id="pending-count">${pendingTotal(state)} 個</span></h3>
      <p class="hint">掴んで倉庫・ゴミ箱・分解へ。巡回中もここへ追加される。</p>

        <div class="zone-desc">基礎部品へ還元し専用枠へ保管</div>

let dragPayload = null;

function bindSlotEl(el) {
  el.addEventListener("dragstart", () => {
    dragPayload = { src: el.dataset.src, index: Number(el.dataset.index), id: el.dataset.id || null };
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => {
    dragPayload = null;
    el.classList.remove("dragging");
  });
  if (el.dataset.src === "pending") {
    el.onclick = () => applySort(stashPending(state, Number(el.dataset.index)));
  }
}

function bindSortEvents() {
  document.querySelectorAll(".slot[draggable=true]").forEach(bindSlotEl);

  document.querySelectorAll("[data-rtab]").forEach((btn) => {
    btn.onclick = () => { itemsRarityTab = btn.dataset.rtab; render(); };
  });
  document.querySelectorAll("[data-items-ptab]").forEach((btn) => {
    btn.onclick = () => { itemsPartTab = btn.dataset.itemsPtab; render(); };
  });
  document.querySelectorAll("[data-sort]").forEach((btn) => {
    btn.onclick = () => { itemsSortBy = btn.dataset.sort; render(); };
  });

  const gridStorage = document.getElementById("grid-storage");
  const gridParts = document.getElementById("grid-parts");
  for (const el of [gridStorage, gridParts]) {
    if (!el) continue;
    el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", () => el.classList.remove("over"));
    el.addEventListener("drop", (e) => {
      e.preventDefault();
      el.classList.remove("over");
      if (dragPayload?.src === "pending") applySort(stashPending(state, dragPayload.index));
    });
  }

  bindDropZone("zone-trash", handleTrashDrop);
  bindDropZone("zone-scrap", handleDismantleDrop);

  const stash = document.getElementById("bulk-stash");
  if (stash) stash.onclick = () => runBulk((i) => stashPending(state, i));
  const scrap = document.getElementById("bulk-scrap");
  if (scrap) scrap.onclick = () => confirmBulkScrap();
  const dismantle = document.getElementById("bulk-dismantle");
  if (dismantle) dismantle.onclick = () => confirmBulkDismantle();
}

function bindDropZone(id, handler) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("over");
    if (dragPayload) handler(dragPayload);
  });
}

function resolveDropItem(p) {
  if (p.src === "pending") return state.pending[p.index] || null;
  if (p.src === "storage") return state.storage[p.index] || null;
  if (p.src === "parts") return { id: p.id, qty: storageCount(state, p.id) };
  return null;
}

function handleTrashDrop(p) {
  const item = resolveDropItem(p);
  if (!item || !item.qty) return;
  const prev = scrapPreview(item.id, item.qty);
  showConfirm({
    title: "予算化しますか",
    body: `${prev.name} ×${prev.qty} を廃棄し、予算 +${prev.gain.toLocaleString()} を得ます。`,
  }).then((ok) => {
    if (!ok) return;
    if (p.src === "pending") applySort(scrapPending(state, p.index));
    else if (p.src === "storage") applySort(scrapStorageSlot(state, p.index));
    else applySort(scrapPart(state, p.id, item.qty));
  });
}

function handleDismantleDrop(p) {
  const item = resolveDropItem(p);
  if (!item || !item.qty) return;
  if (isPart(item.id)) {
    showConfirm({
      title: "分解できません",
      body: "基礎部品を基礎部品には分解できません。ゴミ箱で予算化するか、アイテム制作で上位部品へ精製してください。",
      okOnly: true,
    });
    return;
  }
  const prev = dismantlePreview(item.id, item.qty);
  if (!prev) {
    showConfirm({ title: "分解できません", body: `${itemName(item.id)} は分解できません。`, okOnly: true });
    return;
  }
  showConfirm({
    title: "分解しますか",
    bodyHtml: confirmDismantleHtml(item, prev),
  }).then((ok) => {
    if (!ok) return;
    if (p.src === "pending") applySort(dismantlePending(state, p.index));
    else applySort(dismantleStorageSlot(state, p.index));
  });
}

function confirmBulkScrap() {
  if (!state.pending.length) { toast("未整理がありません"); return; }
  const gain = pendingScrapTotal(state);
  showConfirm({
    title: "すべて廃棄しますか",
    body: `未整理 ${pendingTotal(state)} 個を廃棄し、予算 +${gain.toLocaleString()} を得ます。`,
  }).then((ok) => {
    if (ok) runBulk((i) => scrapPending(state, i));
  });
}

function confirmBulkDismantle() {
  if (!state.pending.length) { toast("未整理がありません"); return; }
  const tot = pendingDismantleTotal(state);
  if (!tot.parts.length) {
    showConfirm({
      title: "分解できません",
      body: "分解できる収容アイテムがありません。基礎部品は分解できません。",
      okOnly: true,
    });
    return;
  }
  const skip = tot.skipped ? `<p>基礎部品 ${tot.skipped} 個は対象外です。</p>` : "";
  const chips = tot.parts.map((x) => confirmYieldChipHtml(x.id, x.qty)).join("");
  showConfirm({
    title: "すべて分解しますか",
    bodyHtml: `${skip}<div class="confirm-craft-label">分解で入手</div><div class="confirm-craft-mats">${chips}</div>`,
  }).then((ok) => {
    if (ok) runBulk((i) => dismantlePending(state, i));
  });
}

function showConfirm({ title, body, bodyHtml, okOnly = false, light = false, wide = false }) {
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.className = "confirm-overlay" + (light ? " light" : "");
    const bodyContent = bodyHtml
      ? `<div class="confirm-body-html">${bodyHtml}</div>`
      : `<p>${escapeHtml(body)}</p>`;
    wrap.innerHTML = `<div class="confirm-box${wide || bodyHtml ? " wide" : ""}">
      <h4>${escapeHtml(title)}</h4>
      ${bodyContent}
      <div class="confirm-actions">
        ${okOnly ? "" : `<button type="button" class="btn btn-sm btn-secondary" data-no>いいえ</button>`}
        <button type="button" class="btn btn-sm btn-primary" data-yes>${okOnly ? "了解" : "はい"}</button>
      </div>
    </div>`;
    document.body.appendChild(wrap);
    const done = (v) => { wrap.remove(); resolve(v); };
    wrap.querySelector("[data-yes]").onclick = () => done(true);
    wrap.querySelector("[data-no]")?.addEventListener("click", () => done(false));
  });
}

const ENHANCE_STAT_KEYS = [
  ["hp", "HP"], ["atk", "物攻"], ["anm", "異能"],
  ["def", "防御"], ["spd", "機動"], ["luck", "運"],
  ["crit", "CRIT"], ["eva", "回避"],
];

function enhanceStatTableHtml(curStat, nextStat) {
  const rows = [];
  rows.push(`<span class="h"></span><span class="h">現在</span><span class="h">強化後</span>`);
  for (const [k, label] of ENHANCE_STAT_KEYS) {
    const a = curStat[k] || 0;
    const b = nextStat[k] || 0;
    if (!a && !b) continue;
    const up = b > a ? " up" : "";
    rows.push(`<span>${label}</span><span>${formatStatValue(k, a)}</span><span class="${up.trim()}">${formatStatValue(k, b)}</span>`);
  }
  return rows.join("");
}

function openEnhanceOverlay(slotId) {
  const piece = gearPieceOf(state.operatorGear?.[slotId]);
  if (!piece) { toast("先に装備してください"); return; }
  const meta = itemMeta(piece.id);
  const maxLv = GAME_DATA.gearEnhance.maxLv;
  const remain = maxLv - piece.lv;
  document.getElementById("gear-enhance-overlay")?.remove();
  const wrap = document.createElement("div");
  wrap.className = "confirm-overlay";
  wrap.id = "gear-enhance-overlay";
  wrap.innerHTML = `<div class="confirm-box enhance-box">
    <button type="button" class="advice-close" data-close>×</button>
    <div class="enhance-head">
      <img src="assets/item/${piece.id}.png" alt="" onerror="this.style.opacity='0.2'">
      <div>
        <h4>${partBadgeHtml(piece.id)}${escapeHtml(meta?.name || piece.id)}</h4>
        <div class="sub">Lv.${piece.lv} / ${maxLv}　${rarityStars(meta?.rarity)}　+${Math.round((GAME_DATA.gearEnhance.statPerLv || 0) * 1000) / 10}%/Lv</div>
      </div>
    </div>
    ${remain < 1
      ? `<p>強化上限です。</p>`
      : `<div class="enhance-slider-row">
          <span class="label">レベル増加</span>
          <input type="range" min="1" max="${remain}" value="1" id="enhance-slider">
          <b id="enhance-delta">+1</b>
        </div>
        <div class="sub" id="enhance-lvline">Lv.${piece.lv} → ${piece.lv + 1}</div>
        <div class="enhance-stats" id="enhance-stats"></div>
        <div class="confirm-craft-label">必要資材（暫定）</div>
        <div class="confirm-craft-mats" id="enhance-mats"></div>
        <div class="confirm-craft-cost" id="enhance-cost"></div>
        <div class="confirm-actions">
          <button type="button" class="btn btn-sm btn-secondary" data-close>閉じる</button>
          <button type="button" class="btn btn-sm btn-accent" id="enhance-go">強化</button>
        </div>`}
  </div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelectorAll("[data-close]").forEach((b) => { b.onclick = close; });
  wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
  if (remain < 1) return;

  const slider = wrap.querySelector("#enhance-slider");
  const refresh = () => {
    const add = Number(slider.value) || 1;
    const cost = gearEnhanceCostRange(piece.lv, piece.lv + add, state);
    const cur = pieceCombatStat(piece);
    const preview = pieceCombatStat({ ...piece, lv: cost.toLv });
    wrap.querySelector("#enhance-delta").textContent = `+${add}`;
    wrap.querySelector("#enhance-lvline").textContent = `Lv.${piece.lv} → ${cost.toLv}`;
    wrap.querySelector("#enhance-stats").innerHTML = enhanceStatTableHtml(cur, preview);
    wrap.querySelector("#enhance-mats").innerHTML = Object.entries(cost.mats)
      .map(([id, n]) => {
        const have = storageCount(state, id);
        const ok = have >= n;
        return `<div class="confirm-craft-mat ${ok ? "ok" : "lack"}">
          <img src="assets/item/${id}.png" alt="" onerror="this.style.opacity='0.25'">
          <span>${escapeHtml(itemName(id))} ×${n}</span>
          <small>所持 ${have}</small>
        </div>`;
      }).join("") || `<div class="confirm-craft-mat">材料なし</div>`;
    const budgetOk = state.budget >= cost.budget;
    const costEl = wrap.querySelector("#enhance-cost");
    costEl.textContent = `予算 ${cost.budget.toLocaleString()}（所持 ${state.budget.toLocaleString()}）`;
    costEl.classList.toggle("lack", !budgetOk);
    const lack = materialsLack(state, cost.mats);
    wrap.querySelector("#enhance-go").disabled = !budgetOk || lack.length > 0;
  };
  slider.oninput = refresh;
  wrap.querySelector("#enhance-go").onclick = () => {
    const r = enhanceOperatorGear(state, slotId, Number(slider.value) || 1);
    toast(r.msg);
    if (r.ok) {
      saveGame(state);
      close();
      render();
    } else refresh();
  };
  refresh();
}

function attachPadHtml(slotDef, equipped, active) {
  const inst = attachInstOf(equipped);

    : `<span class="plus">+</span><span class="lab">${escapeHtml(slotDef.name)}</span>`;

function filteredAttachCandidates(state, attachSlotId) {
  let list = attachCandidates(state, attachSlotId);
  if (attachFilterRarity !== "ALL") {
    list = list.filter((c) => c.rarity === attachFilterRarity);
  }
  list.sort((a, b) => {
    if (attachFilterSort === "name") return a.meta.name.localeCompare(b.meta.name, "ja");
    if (attachFilterSort === "atk" || attachFilterSort === "luck" || attachFilterSort === "def" || attachFilterSort === "spd") {
      const diff = (b.rolls?.[attachFilterSort] || 0) - (a.rolls?.[attachFilterSort] || 0);
      if (diff) return diff;
    }
    const rankDiff = (RARITY_RANK[b.rarity] ?? 0) - (RARITY_RANK[a.rarity] ?? 0);
    if (rankDiff) return rankDiff;
    return a.meta.name.localeCompare(b.meta.name, "ja");
  });
  return list;
}

    let pick = "";
    if (pickKind) {
      const slotDef = GAME_DATA.attachSlots.find((s) => s.id === pickKind);
      const equippedAtt = attachInstOf(loadout[pickKind]);
      const equippedKey = attachInstKey(loadout[pickKind]);
      const cands = filteredAttachCandidates(state, pickKind);
      const rarityTabs = ["ALL", "SS", "S", "A", "B", "C", "D", "E"].map((t) =>
        `<button type="button" class="${attachFilterRarity === t ? "active" : ""}" data-att-rtab="${t}">${t === "ALL" ? "すべて" : rarityStars(t)}</button>`
      ).join("");
      const sorts = [
        ["rarity", "★"],
        ["atk", "物攻"],
        ["luck", "運"],
        ["def", "防御"],
        ["spd", "機動"],
        ["name", "名前"],
      ].map(([id, label]) =>
        `<button type="button" class="${attachFilterSort === id ? "active" : ""}" data-att-sort="${id}">${label}</button>`
      ).join("");
      const rows = cands.map((c) => {
        const on = equippedKey && attachInstKey(c) === equippedKey;
        return `<button type="button" class="equip-pick-row r-${c.rarity}${on ? " active" : ""}" data-put-index="${c.index}">
          <img src="assets/item/${c.id}.png" alt="" onerror="this.style.opacity='0.2'">
          <div>
            <div class="nm">${escapeHtml(c.meta.name)}<span class="stars">${rarityStars(c.rarity)}</span>${on ? " 装着中" : ""}</div>
            <div class="st">${escapeHtml(formatAttachStatLine(c))}</div>
          </div>
        </button>`;
      }).join("");
      pick = `<div class="attach-pick">
        <h5>${escapeHtml(slotDef?.name || pickKind)} — 装着するアタッチメント</h5>
        <div class="rarity-tabs">${rarityTabs}</div>
        <div class="sort-tools">${sorts}</div>
        ${equippedAtt ? `<button type="button" class="btn btn-sm btn-secondary" data-detach>外す（${escapeHtml(itemName(equippedAtt.id))} ${rarityStars(equippedAtt.rarity)}）</button>` : ""}
        ${rows || `<p style="font-size:12px;color:rgb(var(--color-text-muted))">条件に合うパーツがありません。装備制作で製作するかフィルタを緩めてください。</p>`}
      </div>`;
    }
    wrap.innerHTML = `<div class="attach-box">
      <button type="button" class="advice-close" data-close>×</button>
      <h4 style="margin:0 0 12px">${escapeHtml(itemName(piece.id))}${isEquipped ? "（装備中）" : ""} — アタッチメント</h4>
      <div class="attach-layout">
        <div class="attach-stats-col">
          <div class="label">ステータス</div>
          ${statRows || `<div class="row"><span>補正なし</span></div>`}
        </div>
        <div class="attach-stage">
          <div class="attach-gun"><img src="assets/item/${piece.id}.png" alt=""></div>
          ${pads}
        </div>
      </div>
      ${pick}
    </div>`;
    wrap.querySelectorAll("[data-close]").forEach((b) => {
      b.onclick = () => { wrap.remove(); render(); };
    });
    wrap.querySelectorAll("[data-attach-kind]").forEach((btn) => {
      btn.onclick = (e) => { e.stopPropagation(); paint(btn.dataset.attachKind); };
    });
    wrap.querySelectorAll("[data-att-rtab]").forEach((btn) => {
      btn.onclick = (e) => { e.stopPropagation(); attachFilterRarity = btn.dataset.attRtab; paint(pickKind); };
    });
    wrap.querySelectorAll("[data-att-sort]").forEach((btn) => {
      btn.onclick = (e) => { e.stopPropagation(); attachFilterSort = btn.dataset.attSort; paint(pickKind); };
    });
    wrap.querySelectorAll("[data-put-index]").forEach((btn) => {
      btn.onclick = () => {
        const r = attachToWeapon(state, uid, pickKind, Number(btn.dataset.putIndex));
        toast(r.msg);
        if (r.ok) paint(pickKind);
      };
    });
    wrap.querySelector("[data-detach]")?.addEventListener("click", () => {
      const r = detachFromWeapon(state, uid, pickKind);
      toast(r.msg);
      if (r.ok) paint(pickKind);
    });
  };

  wrap.addEventListener("click", (e) => { if (e.target === wrap) { wrap.remove(); render(); } });
  document.body.appendChild(wrap);
  paint(pickKind0 || null);
}

function runBulk(fn) {
  let done = 0;
  let i = 0;
  let guard = 0;
  while (i < state.pending.length && guard++ < 1000) {
    const before = state.pending.length;
    if (fn(i)?.ok) done++;
    if (state.pending.length === before) i++;
  }
  toast(done ? `${done} 種類を処理しました` : "処理できるものがありません");
  saveGame(state);
  render();
}

function applySort(result) {
  if (!result) return;
  toast(result.msg);
  saveGame(state);
  render();
}

/** 合成ベイのステ比較。実測ではなく親との相対バー用 */
const FUSION_STAT_KEYS = [
  ["hp", "HP"],
  ["atk", "物攻"],
  ["anm", "異能"],
  ["def", "防御"],
  ["spd", "機動"],
  ["luck", "幸運"],
];

function fusionBarPct(value, max) {
  return Math.max(4, Math.round((100 * (value || 0)) / Math.max(1, max)));
}

function fusionMiniStatsHtml(stats) {
  const max = Math.max(1, ...FUSION_STAT_KEYS.map(([k]) => stats[k] || 0));
  return `<div class="fusion-mini">${FUSION_STAT_KEYS.map(([k, lab]) => {
    const v = stats[k] || 0;
    return `<div class="fst-mini"><span>${lab}</span><div class="fst-bar"><i style="width:${fusionBarPct(v, max)}%"></i></div><b>${v}</b></div>`;
  }).join("")}</div>`;
}

function fusionStatCell(value, max, isResult, deltaText, deltaClass) {
  const extra = isResult ? `<span class="fst-d ${deltaClass}">${deltaText}</span>` : "";
  return `<div class="fst-cell${isResult ? " result" : ""}">
    <div class="fst-bar"><i style="width:${fusionBarPct(value, max)}%"></i></div>
    <span class="fst-v">${value}</span>${extra}
  </div>`;
}

function fusionSkillsHtml(preview) {
  const native = new Set(GAME_DATA.catalog[preview.childCatalogId].skills || []);
  const chips = preview.skills.map((sk) => {
    const inherited = !native.has(sk.id);
    return `<span class="fusion-sk${inherited ? " inherit" : ""}">${escapeHtml(sk.name)}</span>`;
  }).join("");
  const hasInherit = preview.skills.some((sk) => !native.has(sk.id));
  const note = hasInherit ? `<div class="fusion-skills-note">金枠 = 親から継承（最大6）</div>` : "";
  return `<div class="fusion-skills">${chips}</div>${note}`;
}

function fusionCompareHtml(parentA, parentB, preview) {
  if (!parentA || !parentB || !preview) return "";
  const sa = calcStats(parentA);
  const sb = calcStats(parentB);
  const sc = preview.childStats;
  const max = Math.max(1, ...FUSION_STAT_KEYS.flatMap(([k]) => [sa[k] || 0, sb[k] || 0, sc[k] || 0]));
  const rows = FUSION_STAT_KEYS.map(([k, lab]) => {
    const va = sa[k] || 0;
    const vb = sb[k] || 0;
    const vc = sc[k] || 0;
    const d = vc - Math.max(va, vb);
    const dCls = d > 0 ? "up" : d < 0 ? "down" : "flat";
    const dTxt = d > 0 ? `+${d}` : String(d);
    return `<div class="fst">
      <span class="fst-k">${lab}</span>
      ${fusionStatCell(va, max, false)}
      ${fusionStatCell(vb, max, false)}
      ${fusionStatCell(vc, max, true, dTxt, dCls)}
    </div>`;
  }).join("");
  return `<div class="fusion-compare">
    <div class="fusion-compare-head">
      <span>STAT</span><span>親A</span><span>親B</span><span>結果</span>
    </div>
    ${rows}
    ${fusionSkillsHtml(preview)}
  </div>`;
}

function filteredCrossUnits(state) {
  let list = state.units.slice();
  list = list.filter((u) => {
    const cat = GAME_DATA.catalog[u.catalogId];
    if (!cat) return false;
    if (crossClass !== "ALL" && cat.class !== crossClass) return false;
    if (crossKind === "base" && cat.hybrid) return false;
    if (crossKind === "hybrid" && !cat.hybrid) return false;
    return true;
  });
  list.sort((a, b) => {
    const ca = GAME_DATA.catalog[a.catalogId];
    const cb = GAME_DATA.catalog[b.catalogId];
    if (crossSort === "level") return b.level - a.level || ca.scp.localeCompare(cb.scp);
    if (crossSort === "rank") return (cb.rank || 0) - (ca.rank || 0) || ca.scp.localeCompare(cb.scp);
    if (crossSort === "scp") return ca.scp.localeCompare(cb.scp, "ja");
    return b.rev - a.rev || b.level - a.level || ca.scp.localeCompare(cb.scp);
  });
  return list;
}

function renderCodex() {
  const ids = Object.keys(GAME_DATA.catalog).filter((id) => {
    const c = GAME_DATA.catalog[id];
    const found = state.discovered.includes(id);
    if (codexClass !== "ALL" && c.class !== codexClass) return false;
    if (codexFound === "found" && !found) return false;
    if (codexFound === "missing" && found) return false;
    if (codexKind === "base" && c.hybrid) return false;
    if (codexKind === "hybrid" && !c.hybrid) return false;
    return true;
  });
  ids.sort((a, b) => {
    const ca = GAME_DATA.catalog[a];
    const cb = GAME_DATA.catalog[b];
    if (codexSort === "class") return ca.class.localeCompare(cb.class) || ca.scp.localeCompare(cb.scp);
    if (codexSort === "rank") return (cb.rank || 0) - (ca.rank || 0) || ca.scp.localeCompare(cb.scp);
    return ca.scp.localeCompare(cb.scp, "ja");
  });
  const classTabs = ["ALL", "Safe", "Euclid", "Keter", "Thaumiel"].map((t) =>
    `<button type="button" class="${codexClass === t ? "active" : ""}" data-codex-class="${t}">${t === "ALL" ? "すべて" : t}</button>`
  ).join("");
  const foundTabs = [
    ["ALL", "すべて"], ["found", "発見済"], ["missing", "未発見"],
  ].map(([id, label]) =>
    `<button type="button" class="${codexFound === id ? "active" : ""}" data-codex-found="${id}">${label}</button>`
  ).join("");
  const kindTabs = [
    ["ALL", "すべて"], ["base", "原種"], ["hybrid", "交差種"],
  ].map(([id, label]) =>
    `<button type="button" class="${codexKind === id ? "active" : ""}" data-codex-kind="${id}">${label}</button>`
  ).join("");
  const sorts = [
    ["scp", "番号"], ["class", "クラス"], ["rank", "ランク"],
  ].map(([id, label]) =>
    `<button type="button" class="${codexSort === id ? "active" : ""}" data-codex-sort="${id}">${label}</button>`
  ).join("");
  const cards = ids.map((id) => {

    const skills = c.skills.map((sid) => GAME_DATA.skills[sid]?.name).filter(Boolean).join(" / ");
    return `<article class="codex-card">
      ${catalogArtHtml(id)}
      <span class="stamp${found ? " ok" : ""}">${found ? "発見済" : "未発見"}</span>
      <div class="body">
        <span class="badge" style="background:${classColor(c.class)}33;color:${classColor(c.class)}">${c.class}</span>
        <div class="scp">${escapeHtml(c.scp)}</div>
        <div class="nm">${escapeHtml(c.name)}</div>
        <div class="meta">Rank ${c.rank || "—"}${c.hybrid ? " · 交差種" : ""}</div>
        <p class="look">${escapeHtml(c.look || c.note)}</p>
        <div class="sk">${escapeHtml(skills)}</div>
        ${owned ? `<div class="own">収容中 ×${owned}</div>` : ""}
      </div>
    </article>`;
  }).join("");
  const total = Object.keys(GAME_DATA.catalog).length;
  return `<div class="panel">
    <h2>異能図鑑 ${total}種</h2>
    <p style="font-size:11px;color:rgb(var(--color-text-muted));margin:-4px 0 10px">発見 ${state.discovered.length} / 収録 ${total}　表示 ${ids.length}</p>
    <div class="craft-toolbar">
      <span class="label">クラス</span>
      <div class="sort-tools" style="margin:0">${classTabs}</div>
    </div>
    <div class="craft-toolbar">
      <span class="label">発見</span>
      <div class="sort-tools" style="margin:0">${foundTabs}</div>
    </div>
    <div class="craft-toolbar">
      <span class="label">種別</span>
      <div class="sort-tools" style="margin:0">${kindTabs}</div>
    </div>
    <div class="craft-toolbar">
      <span class="label">並び替え</span>
      <div class="sort-tools" style="margin:0">${sorts}</div>
    </div>
    <div class="codex-grid">${cards || `<div class="craft-empty">該当なし</div>`}</div>
  </div>`;
}

function renderChamber() {
  const need = GAME_DATA.chamberUnlockCount;
  if (state.units.length < need) {
    const pct = Math.round((state.units.length / need) * 100);
    return `<div class="panel">
      <h2>自動試験槽 — 未解放</h2>
      <p style="font-size:13px;color:rgb(var(--color-text-muted))">収容体 ${need} 体以上で解放（現在 ${state.units.length}）。収容体合成やカタログ化で増やす。</p>
      <div class="meter"><div class="meter-head"><span>解放まで</span><span>${state.units.length} / ${need}</span></div>
      <div class="meter-bar"><div class="meter-fill teal" style="width:${pct}%"></div></div></div>
    </div>`;
  }
  const maxSlots = state.chamberMax || 2;
  const inC = state.chamber.map((id) => state.units.find((u) => u.uid === id)).filter(Boolean);
  const bench = state.units.filter((u) => !state.chamber.includes(u.uid) && !state.squad.includes(u.uid));
  const busy = state.units.filter((u) => state.squad.includes(u.uid));
  const xpTick = 20 + state.siteLevel * 5;
  const cells = [];
  for (let i = 0; i < maxSlots; i++) {
    const unit = inC[i];
    if (unit) {
      cells.push(`<div class="squad-cell filled" onclick="removeChamber(${unit.uid})">
        <div class="slot-idx">槽 ${i + 1} — クリックで降ろす</div>
        ${unitCardHtml(unit, { extra: xpBarHtml(unit) })}
      </div>`);
    } else {
      cells.push(`<div class="squad-cell">
        <div class="slot-idx">槽 ${i + 1}</div>
        <div class="empty-slot">空き<br>下から追加</div>
      </div>`);
    }
  }
  return `<div class="panel">
    <h2>自動試験槽 (${inC.length}/${maxSlots})</h2>
    <p style="font-size:12px;color:rgb(var(--color-text-muted))">BOSS勝利のたびに槽内の収容体へ XP +${xpTick}（作戦司令部Lv.${state.siteLevel}）。編成中の個体は入れられない。拠点強化で槽数が増える。</p>
    <div class="squad-board">${cells.join("")}</div>
  </div>
  <div class="panel">
    <h3>追加できる個体 (${bench.length})</h3>
    <div class="unit-grid">${bench.map((u) => unitCardHtml(u, { onclick: `addChamber(${u.uid})`, extra: xpBarHtml(u) })).join("") || "<p>追加できる個体がいない（全員が編成中か槽に入っている）</p>"}</div>
    ${busy.length ? `<h3 style="margin-top:12px">編成中のため追加不可 (${busy.length})</h3><div class="unit-grid">${busy.map((u) => unitCardHtml(u, { extra: "<div class='meta'>編成中</div>" })).join("")}</div>` : ""}
  </div>`;
}

function craftableCountFor(kinds) {
  return craftableList().filter((m) => kinds.includes(m.kind)).length;
}

function craftAffordable(state, meta) {
  const cost = meta.craftCost || 0;
  if (state.budget < cost) return false;
  return Object.entries(meta.craft).every(([id, n]) => storageCount(state, id) >= n);
}

function filteredCraftableList(state) {
  const shop = CRAFT_SHOPS[currentView];
  let list = craftableList();
  if (shop) {
    list = list.filter((m) => shop.kinds.includes(m.kind));
    if (alchemyKindTab !== "ALL" && !shop.kinds.includes(alchemyKindTab)) alchemyKindTab = "ALL";
  }
  if (alchemyKindTab !== "ALL") list = list.filter((m) => m.kind === alchemyKindTab);
  if (alchemyRarityTab !== "ALL") list = list.filter((m) => m.rarity === alchemyRarityTab);
  if (alchemyPartTab !== "ALL" && shop?.kinds.some((k) => k === "gear" || k === "attach")) {
    list = list.filter((m) => gearPartFilterId(m) === alchemyPartTab);
  }
  if (alchemyCraftableOnly) list = list.filter((m) => craftAffordable(state, m));
  const rank = (r) => RARITY_RANK[r] ?? 0;
  list.sort((a, b) => {
    if (alchemySortBy === "name") return a.name.localeCompare(b.name, "ja");
    if (alchemySortBy === "cost") return (a.craftCost || 0) - (b.craftCost || 0);
    if (alchemySortBy === "stock") return storageCount(state, b.id) - storageCount(state, a.id);
    const rankDiff = rank(b.rarity) - rank(a.rarity);
    return rankDiff || a.name.localeCompare(b.name, "ja");
  });
  return list;
}

function craftMatChip(state, id, need) {
  const have = storageCount(state, id);
  const ok = have >= need;
  return `<span class="craft-mat ${ok ? "ok" : "lack"}" data-item-hover="${id}">
    <img src="assets/item/${id}.png" alt="" onerror="this.style.opacity='0.25'">
    <span>${escapeHtml(itemName(id))}×${need}<small>(${have})</small></span>
  </span>`;
}

function craftConfirmMatsHtml(state, meta, qty) {
  return Object.entries(meta.craft).map(([id, n]) => {
    const need = n * qty;
    const have = storageCount(state, id);
    const ok = have >= need;
    return `<div class="confirm-craft-mat ${ok ? "ok" : "lack"}">
      <img src="assets/item/${id}.png" alt="" onerror="this.style.opacity='0.25'">
      <span>${escapeHtml(itemName(id))} ×${need}</span>
      <small>所持 ${have}</small>
    </div>`;
  }).join("");
}

function showCraftConfirm(state, meta) {
  return new Promise((resolve) => {
    const max = maxCraftCount(state, meta.id);
    if (max < 1) {
      toast("材料または予算が不足しています");
      resolve(0);
      return;
    }
    let qty = 1;
    const wrap = document.createElement("div");
    wrap.className = "confirm-overlay";
    wrap.innerHTML = `<div class="confirm-box wide">
      <h4>制作しますか？</h4>
      <div class="confirm-body-html">
        <div class="confirm-craft">
          <div class="confirm-craft-out">
            <img src="assets/item/${meta.id}.png" alt="" onerror="this.style.opacity='0.2'">
            <div>
              <strong style="color:${gradeColor(meta.id)}">${escapeHtml(meta.name)}</strong>
              <span style="color:#ffd93d;margin-left:4px">${rarityStars(meta.rarity)}</span>
            </div>
          </div>
          <div class="craft-qty-row">
            <span class="label">個数</span>
            <button type="button" class="craft-qty-btn" data-qty-minus aria-label="減らす">−</button>
            <input type="range" class="craft-qty-slider" min="1" max="${max}" value="1" step="1">
            <button type="button" class="craft-qty-btn" data-qty-plus aria-label="増やす">+</button>
            <span class="craft-qty-num">×1</span>
            ${max > 1 ? `<span class="craft-qty-max">最大 ${max}</span>` : ""}
          </div>
          <div class="confirm-craft-label">必要素材</div>
          <div class="confirm-craft-mats"></div>
          <div class="confirm-craft-cost"></div>
        </div>
      </div>
      <div class="confirm-actions">
        <button type="button" class="btn btn-sm btn-secondary" data-no>いいえ</button>
        <button type="button" class="btn btn-sm btn-primary" data-yes>はい</button>
      </div>
    </div>`;
    document.body.appendChild(wrap);

    const matsEl = wrap.querySelector(".confirm-craft-mats");
    const costEl = wrap.querySelector(".confirm-craft-cost");
    const qtyEl = wrap.querySelector(".craft-qty-num");
    const slider = wrap.querySelector(".craft-qty-slider");
    const btnMinus = wrap.querySelector("[data-qty-minus]");
    const btnPlus = wrap.querySelector("[data-qty-plus]");
    const btnYes = wrap.querySelector("[data-yes]");

    const refresh = () => {
      const cost = (meta.craftCost || 0) * qty;
      const budgetOk = state.budget >= cost;
      matsEl.innerHTML = craftConfirmMatsHtml(state, meta, qty);
      costEl.textContent = `予算 ${cost.toLocaleString()}（所持 ${state.budget.toLocaleString()}）`;
      costEl.classList.toggle("lack", !budgetOk);
      qtyEl.textContent = `×${qty}`;
      slider.value = String(qty);
      btnMinus.disabled = qty <= 1;
      btnPlus.disabled = qty >= max;
      btnYes.disabled = qty < 1;
    };

    const setQty = (v) => {
      qty = Math.max(1, Math.min(max, v | 0));
      refresh();
    };

    btnMinus.onclick = () => setQty(qty - 1);
    btnPlus.onclick = () => setQty(qty + 1);
    slider.oninput = () => setQty(Number(slider.value));
    refresh();

    const done = (v) => { wrap.remove(); resolve(v); };
    btnYes.onclick = () => done(qty);
    wrap.querySelector("[data-no]").onclick = () => done(0);
  });
}

function craftCardHtml(state, meta) {
  const affordable = craftAffordable(state, meta);
  const cost = meta.craftCost || 0;
  const mats = Object.entries(meta.craft).map(([id, n]) => craftMatChip(state, id, n)).join("");

    ? `<div class="sk" style="font-size:10px;color:rgb(var(--color-accent));margin-top:2px">固有: ${escapeHtml(meta.skill.name)}</div>`
    : "";
  return `<div class="craft-card r-${meta.rarity || "E"}${affordable ? " affordable" : " locked"}" data-item-hover="${meta.id}">

      <img src="assets/item/${meta.id}.png" alt="" onerror="this.style.opacity='0.2'">
      <div>
        <div class="nm" style="color:${gradeColor(meta.id)}">${partBadgeHtml(meta.id)}${escapeHtml(meta.name)}<span class="stars">${rarityStars(meta.rarity)}</span></div>
        <span class="craft-kind">${CRAFT_KIND_LABELS[meta.kind] || meta.kind}</span>

function siteInspectOf() {
  const n = siteInspectLevel | 0;
  if (n >= 1 && n <= GAME_DATA.siteUpgrades.length) return n;
  return state.siteLevel;
}

function siteNodeStatus(level) {
  if (level < state.siteLevel) return { cls: "done", tag: "完了" };
  if (level === state.siteLevel) return { cls: "current", tag: "運用中" };
  if (level === state.siteLevel + 1) {
    const next = GAME_DATA.siteUpgrades[level - 1];
    return { cls: "next", tag: "要 予算+資材" };
  }
  return { cls: "locked", tag: "未到達" };
}

function siteStatDelta(fromVal, toVal, suffix = "") {
  const d = toVal - fromVal;
  if (!d) return `${toVal}${suffix}`;
  const sign = d > 0 ? "+" : "";
  return `${toVal}${suffix} <span class="up">${sign}${d}${suffix}</span>`;
}

function renderSiteHover(inspect, cur) {
  const { tag } = siteNodeStatus(inspect.level);
  const stam = GAME_DATA.staminaMaxBase + inspect.staminaBonus;
  const stamCur = GAME_DATA.staminaMaxBase + cur.staminaBonus;
  const vsCur = inspect.level !== cur.level;
  const stamLine = vsCur ? siteStatDelta(stamCur, stam) : String(stam);
  const slotLine = vsCur ? siteStatDelta(cur.chamberSlots, inspect.chamberSlots) : String(inspect.chamberSlots);
  const dropNow = Math.round(inspect.dropBonus * 100);
  const dropCur = Math.round(cur.dropBonus * 100);
  const dropLine = vsCur ? siteStatDelta(dropCur, dropNow, "%") : `${dropNow}%`;
  const isNext = inspect.level === state.siteLevel + 1;
  const isMax = !GAME_DATA.siteUpgrades[state.siteLevel];
  let action = "";
  if (isNext) {
    const lack = materialsLack(state, inspect.materials);
    const can = state.budget >= inspect.cost && !lack.length;
    const mats = Object.entries(inspect.materials || {}).map(([id, n]) => craftMatChip(state, id, n)).join("");
    const why = !can
      ? (state.budget < inspect.cost ? "（予算不足）" : "（資材不足）")
      : "";
    action = `<div class="cost">拡張費用 ${inspect.cost.toLocaleString()} / 所持 ${state.budget.toLocaleString()}</div>
      <div class="craft-mats" style="margin:8px 0">${mats}</div>
      <button type="button" class="btn btn-accent" id="btn-upgrade-site" ${can ? "" : "disabled"}>拡張する — ${inspect.cost.toLocaleString()}${why}</button>`;
  } else if (inspect.level === state.siteLevel) {
    action = isMax
      ? `<p class="cost">最大レベル。これ以上の拡張はない。</p>`
      : `<p class="cost">次のノードを選ぶと拡張できる。</p>`;
  } else if (inspect.level < state.siteLevel) {
    action = `<p class="cost">すでに拡張済み。</p>`;
  } else {
    action = `<p class="cost">先に前段階を拡張してください。</p>`;
  }
  return `<aside class="site-hover">
    <div class="kicker">Lv.${inspect.level} 詳細 — ${tag}</div>
    <h2>${escapeHtml(inspect.name)}</h2>
    <p class="desc">${escapeHtml(inspect.desc || "")}</p>
    <dl class="site-hover-stats">
      <div><dt>許可証上限</dt><dd>${stamLine}</dd></div>
      <div><dt>試験槽</dt><dd>${slotLine}</dd></div>
      <div><dt>ドロップ補正</dt><dd>${dropLine}</dd></div>
    </dl>
    ${action}
  </aside>`;
}

function ptreeClusterClass(cluster) {
  return `c-${cluster || "core"}`;
}

function ptreeKindLabel(kind) {
  if (kind === "keystone") return "キーストーン";
  if (kind === "notable") return "著名";
  if (kind === "start") return "起点";
  return "小ノード";
}

function renderTreeHover(node, allocated, reachable, unspent) {
  const on = allocated.has(node.id);
  const cost = node.cost || 0;
  const p = sitePassives(state);
  let action = "";
  if (on) {
    action = `<p class="cost">割り当て済み。</p>`;
  } else if (!reachable) {
    action = `<p class="cost">隣接する取得済みノードから伸ばしてください。</p>`;
  } else if (unspent < cost) {
    action = `<p class="cost">プロトコル点が不足（要 ${cost} / 残 ${unspent}）。作戦司令部を拡張すると点が入る。</p>`;
  } else {
    action = `<button type="button" class="btn btn-accent" id="btn-alloc-node" data-alloc="${node.id}">割り当て — ${cost}点</button>`;
  }
  const effects = Object.entries(node.effects || {}).map(([k, v]) => {
    const label = ({
      sentryAmmo: "セントリー残弾", sentryRadius: "セントリー射程", sentryMax: "設置上限",
      sentrySave: "残弾消費回避", enhanceMat: "強化素材", enhanceBudget: "強化予算",
      craftCost: "クラフト予算", dismantleChance: "分解追加率", dismantleExtra: "分解追加個数",
      stamina: "許可証上限", dropBonus: "ドロップ補正", chamber: "試験槽", reconSpeed: "巡回速度",
    })[k] || k;
    let shown = v;
    if (k === "enhanceMat" || k === "enhanceBudget" || k === "craftCost" || k === "reconSpeed") {
      shown = `${Math.round((v - 1) * 100)}%`;
    } else if (k === "dismantleChance" || k === "sentrySave" || k === "dropBonus") {
      shown = `${Math.round(v * 100)}%`;
    } else if (v > 0 && k !== "dismantleExtra") shown = `+${v}`;
    return `<div><dt>${label}</dt><dd>${shown}</dd></div>`;
  }).join("") || `<div><dt>効果</dt><dd>なし</dd></div>`;
  const icon = node.icon
    ? `<img class="ptree-hover-icon" src="assets/tree/${node.icon}.png" alt="" onerror="this.style.display='none'">`
    : "";
  return `<aside class="site-hover">
    <div class="ptree-hover-head">
      ${icon}
      <div>
        <div class="kicker">${ptreeKindLabel(node.kind)} — ${node.cluster}</div>
        <h2>${escapeHtml(node.name)}</h2>
      </div>
    </div>
    <p class="desc">${escapeHtml(node.desc || "")}</p>
    <dl class="site-hover-stats">${effects}</dl>
    <p class="cost">現在パッシブ: 素材×${(p.enhanceMat || 1).toFixed(2)} / 分解追加 ${Math.round((p.dismantleChance || 0) * 100)}% / 砲台 ${sentryMaxOf(state)}</p>
    ${action}
  </aside>`;
}

function renderPtree(allocated, inspectId) {
  const spec = GAME_DATA.siteTree;
  const byId = siteTreeNodeMap();
  const lines = (spec.edges || []).map(([a, b]) => {
    const na = byId.get(a);
    const nb = byId.get(b);
    if (!na || !nb) return "";
    const on = allocated.has(a) && allocated.has(b);
    return `<line x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="${on ? "#c4a34a" : "#243040"}" stroke-width="${on ? 2.2 : 1.2}"/>`;
  }).join("");
  const pins = (spec.nodes || []).map((n) => {
    const on = allocated.has(n.id);
    const reach = !on && siteNodeReachable(state, n.id);
    const locked = !on && !reach;
    const sel = n.id === inspectId ? " selected" : "";
    const kind = n.kind === "keystone" || n.kind === "notable" || n.kind === "start" ? n.kind : "";
    const icon = n.icon
      ? `<img src="assets/tree/${n.icon}.png" alt="" draggable="false" onerror="this.style.display='none'">`
      : "";
    return `<button type="button" class="ptree-node ${ptreeClusterClass(n.cluster)} ${kind} ${on ? "on" : ""} ${reach ? "reach" : ""} ${locked ? "locked" : ""}${sel}" data-tree-id="${n.id}" style="left:${(n.x / 10).toFixed(2)}%;top:${((n.y / 680) * 100).toFixed(2)}%" title="${escapeHtml(n.name)}">${icon}</button>`;
  }).join("");
  return `<div>
    <div class="ptree-stage">
    <svg viewBox="0 0 1000 680" aria-hidden="true">${lines}</svg>
    <div class="ptree-pins">${pins}</div>
  </div>
  <div class="ptree-legend">
    <span><i style="background:#c4a34a"></i>砲台</span>
    <span><i style="background:#7a8a58"></i>工廠</span>
    <span><i style="background:#b07048"></i>解体</span>
    <span><i style="background:#5a7a98"></i>運用</span>
    <span>◇ キーストーン　● 著名</span>
  </div>
  </div>`;
}

function renderSite() {
  ensureSiteTree(state);
  const cur = GAME_DATA.siteUpgrades[state.siteLevel - 1];
  const inspectLv = siteInspectOf();
  const inspect = GAME_DATA.siteUpgrades[inspectLv - 1];
  const facility = GAME_DATA.siteUpgrades.map((s, i) => {
    const { cls, tag } = siteNodeStatus(s.level);
    const selected = s.level === inspectLv && siteInspectKind === "facility" ? " selected" : "";
    const link = i < GAME_DATA.siteUpgrades.length - 1
      ? `<div class="site-link${s.level < state.siteLevel ? " on" : ""}"></div>`
      : "";
    return `<button type="button" class="site-node ${cls}${selected}" data-site-lv="${s.level}">
      <span class="site-node-gem"><b>${s.level}</b></span>
      <span>
        <span class="site-node-name">${escapeHtml(s.name)}</span>
        <span class="site-node-tag">${tag}</span>
      </span>
    </button>${link}`;
  }).join("");
  const allocated = siteAllocatedSet(state);
  const nodeMap = siteTreeNodeMap();
  const inspectId = nodeMap.has(siteInspectNode) ? siteInspectNode : GAME_DATA.siteTree.startId;
  const treeNode = nodeMap.get(inspectId);
  const unspent = sitePointsUnspent(state);
  const total = sitePointsTotal(state);
  const hover = renderTreeHover(treeNode, allocated, siteNodeReachable(state, inspectId), unspent);
  const respecCost = GAME_DATA.siteTree.respecCost || 400;
  const canRespec = sitePointsSpent(state) > 0 && state.budget >= respecCost;
  return `<div class="panel">
    <h2>作戦司令部Lv <small style="font-weight:400;color:rgb(var(--color-text-muted))">Lv.${state.siteLevel} — ${escapeHtml(cur.name)}</small></h2>
    <div class="site-tree-layout">
      <div class="site-tree">${facility}</div>
      ${renderSiteHover(inspect, cur)}
    </div>
  </div>
  <div class="panel">
    <h2>プロトコルツリー</h2>
    <div class="ptree-bar">
      <span>プロトコル点 <strong>${unspent}</strong> / ${total}</span>
      <span>作戦司令部Lvごとに +${GAME_DATA.siteTree.pointsPerLevel}</span>
      <button type="button" class="btn btn-sm btn-secondary" id="btn-respec-tree" ${canRespec ? "" : "disabled"}>再編成 — ${respecCost}</button>
    </div>
    <p style="font-size:11px;color:rgb(var(--color-text-muted));margin:-4px 0 10px">取得済みに隣接するノードだけ割り当てできる。砲台・工廠・解体・運用の4クラスタ。</p>
    <div class="ptree-layout">
      ${renderPtree(allocated, inspectId)}
      ${hover}
    </div>
  </div>`;
}

let itemHoverCurrent = null;
let itemHoverBound = false;

function hoverItemEl(node) {
  if (!node || node.nodeType !== 1) return null;
  return node.closest("[data-item-hover]");
}

function itemHoverStatsHtml(stat) {
  const labels = {
    hp: "HP", atk: "物攻", anm: "異能", def: "防御", spd: "機動", luck: "運",
    crit: "CRIT", eva: "回避", all: "全能力", regen: "回復",
  };
  const rows = [];
  const seen = new Set();
  const add = (k, v) => {
    if (v == null || v === 0) return;
    if (seen.has(k)) return;
    seen.add(k);
    rows.push(`<div><dt>${labels[k] || k}</dt><dd>${formatStatValue(k, v)}</dd></div>`);
  };
  if (stat?.all) add("all", stat.all);
  for (const [k] of ENHANCE_STAT_KEYS) add(k, stat?.[k]);
  for (const [k, v] of Object.entries(stat || {})) {
    if (k === "all") continue;
    add(k, v);
  }
  if (!rows.length) return "";
  return `<div class="item-hover-stats">${rows.join("")}</div>`;
}

function itemHoverEffect(meta, id) {
  if (meta?.skill?.name) return { name: meta.skill.name, desc: meta.skill.desc || "" };
  const battle = typeof GEAR_BATTLE_SKILLS !== "undefined" ? GEAR_BATTLE_SKILLS[id] : null;
  if (battle) return { name: battle.name, desc: battle.desc || "" };
  if (meta?.kind === "attach") return { name: "装着補正", desc: "銃の個体にステータスを加算する。個体ごとにレアと振れ幅が付く。" };
  if (meta?.kind === "object") return { name: "収容補正", desc: "カタログ化時に個体へ加算される。" };
  if (meta?.kind === "part") return { name: "基礎部品", desc: "クラフトと装備強化の材料。分解できない。" };
  if (meta?.kind === "artifact") return { name: "アーティファクト", desc: "装備スロットに装着して能力を底上げする。" };
  return { name: "", desc: "" };
}

function itemHoverCardHtml(el) {
  const id = el.dataset.itemHover;
  const meta = itemMeta(id);
  if (!meta) return "";
  let stat = null;
  let sub = CRAFT_KIND_LABELS[meta.kind] || meta.kind || "";
  let rarity = meta.rarity || "E";

  if (el.dataset.hoverAttach && el.dataset.attUid) {
    const inst = attachInstOf(loadoutOf(state, el.dataset.attUid)[el.dataset.attachKind]);
    if (inst) {
      rarity = inst.rarity || rarity;
      stat = inst.rolls || {};
      const slotMeta = GAME_DATA.attachSlots.find((s) => s.id === el.dataset.attachKind);
      sub = slotMeta ? `${slotMeta.name} / アタッチメント` : "アタッチメント";
    }
  } else if (el.dataset.hoverSlot && state.operatorGear) {
    const piece = gearPieceOf(state.operatorGear[el.dataset.hoverSlot]);
    if (piece) {
      stat = pieceCombatStatFull(state, piece);
      sub = `Lv.${piece.lv || 0} / ${sub}`;
    }
  } else if (el.dataset.hoverLv != null && el.dataset.hoverLv !== "") {
    const lv = Number(el.dataset.hoverLv) || 0;
    const uid = el.dataset.hoverUid || null;
    stat = pieceCombatStatFull(state, makeGearPiece(id, lv, uid));
    sub = `Lv.${lv} / ${sub}`;
  } else if (meta.kind === "attach") {
    stat = meta.stat || {};
    sub = "アタッチメント（個体ごとに振れ幅）";
  } else if (meta.stat) {
    stat = flattenGearStat(meta.stat);
  } else if (meta.bonus) {
    stat = meta.bonus;
    sub = "収容時補正";
  }

  const fx = itemHoverEffect(meta, id);
  const partBadge = partBadgeHtml(id);
  const statsHtml = itemHoverStatsHtml(stat);
  const fxHtml = (fx.name || fx.desc)
    ? `<div class="item-hover-fx">${fx.name ? `<strong>${escapeHtml(fx.name)}</strong>` : ""}<p>${escapeHtml(fx.desc || "効果説明なし")}</p></div>`
    : `<div class="item-hover-fx"><p>効果説明なし</p></div>`;
  const partName = gearPartName(id);
  if (partName && !sub.includes(partName)) sub = `${partName} / ${sub}`;

  return `<div class="item-hover-kicker">INSPECT // ${escapeHtml((meta.kind || "ITEM").toUpperCase())}</div>
    <div class="item-hover-head">
      <img src="assets/item/${id}.png" alt="" onerror="this.style.opacity='0.2'">
      <div>
        <div class="nm">${partBadge}${escapeHtml(meta.name)}</div>
        <div class="stars">${rarityStars(rarity)}</div>
        <div class="sub">${escapeHtml(sub)}</div>
      </div>
    </div>
    ${statsHtml || `<div class="item-hover-stats"><div><dt>価値</dt><dd>${itemValue(id).toLocaleString()}</dd></div></div>`}
    ${fxHtml}`;
}

function placeItemHover(e) {
  const box = document.getElementById("item-hover");
  if (!box || box.hidden) return;
  const pad = 16;
  const r = box.getBoundingClientRect();
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
  if (x < 8) x = 8;
  if (y < 8) y = 8;
  box.style.left = `${x}px`;
  box.style.top = `${y}px`;
}

function showItemHover(el, e) {
  if (!state) return;
  if (document.querySelector(".confirm-overlay, .battle-overlay")) return;
  const box = document.getElementById("item-hover");
  if (!box) return;
  const html = itemHoverCardHtml(el);
  if (!html) { hideItemHover(); return; }
  itemHoverCurrent = el;
  box.innerHTML = html;
  box.hidden = false;
  if (e) placeItemHover(e);
}

function hideItemHover() {
  itemHoverCurrent = null;
  const box = document.getElementById("item-hover");
  if (!box) return;
  box.hidden = true;
  box.innerHTML = "";
}

function bindItemHover() {
  if (itemHoverBound) return;
  itemHoverBound = true;
  document.addEventListener("mouseover", (e) => {
    const el = hoverItemEl(e.target);
    if (!el) return;
    if (itemHoverCurrent !== el) showItemHover(el, e);
  });
  document.addEventListener("mousemove", (e) => {
    if (!itemHoverCurrent) return;
    placeItemHover(e);
  });
  document.addEventListener("mouseout", (e) => {
    if (!itemHoverCurrent) return;
    if (!hoverItemEl(e.relatedTarget)) hideItemHover();
  });
}

function doSentrySkill() {
  if (!Array.isArray(state.sentries)) state.sentries = [];
  if (sentryPlaceMode) {
    sentryPlaceMode = false;
    sentryPreview = null;
    render();
    return;
  }
  if (state.sentries.length >= sentryMaxOf(state)) {
    toast(`設置上限です（${sentryMaxOf(state)}基）。MAP上の砲台をクリックして削除してください`);
    return;
  }
  sentryPlaceMode = true;
  sentryPreview = null;
  toast("解明した室内にセントリーガンを配置してください");
  render();
}

function canvasToSector(canvas, ev) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (ev.clientX - rect.left) * (canvas.width / rect.width),
    y: (ev.clientY - rect.top) * (canvas.height / rect.height),
  };
}

function onSectorCanvasClick(ev) {
  if (sentryBusy || !sectorSim) return;
  const canvas = ev.currentTarget;
  const { x, y } = canvasToSector(canvas, ev);
  const hit = sentryIndexAt(state.sentries || [], x, y);
  if (hit >= 0) {
    askRemoveSentry(hit);
    return;
  }
  if (!sentryPlaceMode) return;
  if ((state.sentries || []).length >= sentryMaxOf(state)) {
    toast(`設置上限です（${sentryMaxOf(state)}基）`);
    return;
  }
  const room = roomContaining(sectorSim.sector, x, y);
  if (!room) {
    toast("室内に配置してください");
    return;
  }
  if (!isRoomRevealed(sectorSim, room.id)) {
    toast("解明した室内にだけ配置できます");
    return;
  }
  sentryPreview = { x, y };
  sentryBusy = true;
  if (canvas && sectorSim) drawSector(canvas.getContext("2d"), sectorSim);
  showConfirm({
    title: "配置しますか？",
    body: `${room.code} ${room.name} に設置します。射程内の敵を自動撃破します。`,
    light: true,
  }).then((ok) => {
    sentryBusy = false;
    sentryPreview = null;
    if (ok) {
      if (!Array.isArray(state.sentries)) state.sentries = [];
      if (state.sentries.length >= sentryMaxOf(state)) {
        toast(`設置上限です（${sentryMaxOf(state)}基）`);
      } else {
        state.sentries.push({ x, y, ammo: sentryAmmoMaxOf(state) });
        sentryPlaceMode = false;
        saveGame(state);
        toast(`セントリーガンを配置（${state.sentries.length}/${sentryMaxOf(state)}）`);
      }
    }
    render();
  });
}

function askRemoveSentry(index) {
  if (sentryBusy) return;
  sentryBusy = true;
  sentryPlaceMode = false;
  sentryPreview = null;
  showConfirm({
    title: "削除しますか？",
    body: "このセントリーガンを撤去します。設置枠が 1 つ戻ります。",
    light: true,
  }).then((ok) => {
    sentryBusy = false;
    if (ok && state.sentries && index >= 0 && index < state.sentries.length) {
      state.sentries.splice(index, 1);
      saveGame(state);
      toast(`セントリーガンを削除（${state.sentries.length}/${sentryMaxOf(state)}）`);
    }
    render();
  });
}

function battleFighterArt(f) {
  return f.isOperator
    ? `<div class="catalog-art"><img src="assets/user/user.jpg" alt=""></div>`
    : catalogArtHtml(f.catalogId);
}

function battleFighterHtml(f, side) {
  const art = battleFighterArt(f);
  return `<div class="bf ${side}" data-fid="${f.id}">
    ${art}
    <div>
      <div class="bf-name">${escapeHtml(f.name)}</div>
      <div class="bar"><i data-bar></i></div>
      <div class="bf-hp" data-hp>${f.maxHp} / ${f.maxHp}</div>
    </div>
  </div>`;
}

function setBattleHp(root, id, hp, maxHp) {
  const row = root.querySelector(`[data-fid="${id}"]`);
  if (!row) return;
  const pct = maxHp > 0 ? Math.max(0, Math.round((hp / maxHp) * 100)) : 0;
  const bar = row.querySelector("[data-bar]");
  const label = row.querySelector("[data-hp]");
  if (bar) bar.style.width = `${pct}%`;
  if (label) label.textContent = `${Math.max(0, hp)} / ${maxHp}`;
  row.classList.toggle("dead", hp <= 0);
}

function battleResultHtml(result) {
  const loot = result.loot || [];
  const cards = result.allyCards || [];
  const lootHtml = loot.length
    ? loot.map((it) => `<span class="result-chip">
        <img src="assets/item/${it.id}.png" alt="" onerror="this.style.opacity='0.2'">
        ${escapeHtml(it.name)} <b>×${it.qty || 1}</b>
      </span>`).join("")
    : `<span class="result-empty">入手なし</span>`;
  const budgetHtml = result.budgetGain
    ? `<span class="result-chip budget">予算 +${Number(result.budgetGain).toLocaleString()}</span>`
    : "";
  const discHtml = (result.discoveries || []).map((d) =>
    `<div class="result-disc">${catalogArtHtml(d.catalogId)}<span>${escapeHtml(d.name)}</span></div>`
  ).join("");
  const slots = cards.slice(0, 6);
  while (slots.length < 6) slots.push(null);
  const unitHtml = slots.map((f) => {
    if (!f) return `<div class="result-unit empty"></div>`;
    const hpPct = f.maxHp > 0 ? Math.max(0, Math.round((f.hp / f.maxHp) * 100)) : 0;
    const up = (f.levelAfter || 0) > (f.levelBefore || 0);
    const showXp = !f.isOperator && (f.xpNeed || 0) > 0;
    const xpPct = showXp ? Math.min(100, Math.round((f.xpNow / f.xpNeed) * 100)) : 0;
    const xpNum = showXp
      ? `EXP ${f.xpNow} / ${f.xpNeed}${f.xpGain ? ` +${f.xpGain}` : ""}${up ? `　Lv.${f.levelBefore}→<b>Lv.${f.levelAfter}</b>` : ""}`
      : "EXP —";
    return `<div class="result-unit${f.hp <= 0 ? " dead" : ""}">
      ${battleFighterArt(f)}
      <div class="bf-name">${escapeHtml(f.name)}</div>
      <div class="bar"><i style="width:${hpPct}%"></i></div>
      <div class="bf-hp">HP ${Math.max(0, f.hp)} / ${f.maxHp}</div>
      <div class="bar xp"><i style="width:${xpPct}%"></i></div>
      <div class="bf-hp${up ? " lvup" : ""}">${xpNum}</div>
    </div>`;
  }).join("");
  const maxDealt = Math.max(0, ...cards.map((f) => f.dmgDealt || 0));
  const maxTaken = Math.max(0, ...cards.map((f) => f.dmgTaken || 0));
  const dmgSlots = cards.slice(0, 6);
  while (dmgSlots.length < 6) dmgSlots.push(null);
  const dmgHtml = dmgSlots.map((f) => {
    if (!f) return `<div class="result-dmg empty"></div>`;
    const dealt = f.dmgDealt || 0;
    const taken = f.dmgTaken || 0;
    const dealtPct = maxDealt > 0 ? Math.round((dealt / maxDealt) * 100) : 0;
    const takenPct = maxTaken > 0 ? Math.round((taken / maxTaken) * 100) : 0;
    return `<div class="result-dmg">
      ${battleFighterArt(f)}
      <div class="bf-name">${escapeHtml(f.name)}</div>
      <div class="bar dealt"><i style="width:${dealtPct}%"></i></div>
      <div class="bf-hp dealt" title="与えたダメージ">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.8 1.4 14.6 5.2 6.5 13.3 2.2 14.8 3.7 10.5zM12.2 2.8 13.2 1.8 14.2 2.8 13.2 3.8z"/></svg>
        ${dealt.toLocaleString()}
      </div>
      <div class="bar taken"><i style="width:${takenPct}%"></i></div>
      <div class="bf-hp taken" title="受けたダメージ">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.4 13.6 4v3.4c0 3.4-2.4 5.7-5.6 7.2C4.8 13.1 2.4 10.8 2.4 7.4V4z"/></svg>
        ${taken.toLocaleString()}
      </div>
    </div>`;
  }).join("");
  const advance = result.win && result.advancedTo
    ? `<p class="result-empty" style="margin-top:8px">${escapeHtml(floorName(result.advancedTo))} へ進出</p>`
    : "";
  return `<div class="label">入手アイテム</div>
    <div class="result-loot">${lootHtml}${budgetHtml}</div>
    ${discHtml ? `<div class="label">新規発見</div>${discHtml}` : ""}
    <div class="label">展開チーム</div>
    <div class="result-team">${unitHtml}</div>
    <div class="label">ダメージ</div>
    <div class="result-dmg-list">${dmgHtml}</div>
    ${advance}`;
}
